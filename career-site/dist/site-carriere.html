            '<figure class="cs-quote"><blockquote>' + e(it.quote) + '</blockquote><figcaption>' +
            (it.photo && !U.isPlaceholder(it.photo) ? '<img class="cs-avatar" src="' + e(it.photo) + '" alt="">' : '<span class="cs-avatar cs-avatar--' + (i % 3) + '" aria-hidden="true">' + e(initials(it.name)) + '</span>') +
            '<span><strong>' + e(it.name) + '</strong><span>' + e(it.role) + '</span></span></figcaption></figure>'
          ).join('') +
          '</div></div>';
      },
    },

    process: {
      label: 'Process de recrutement', icon: 'flag', desc: 'Les étapes, dans l’ordre',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'intro', label: 'Introduction', type: 'textarea', rows: 2 },
        { key: 'items', label: 'Étapes', type: 'list', itemLabel: 'title', max: 8, add: { title: 'Nouvelle étape', text: '', duration: '' }, fields: [{ key: 'title', label: 'Étape', type: 'text' }, { key: 'text', label: 'Description', type: 'textarea', rows: 2 }, { key: 'duration', label: 'Durée', type: 'text' }] },
      ],
      defaults: { title: 'Notre process de recrutement', intro: '', items: [{ title: 'Candidature', text: '', duration: '' }, { title: 'Entretien', text: '', duration: '1 h' }, { title: 'Proposition', text: '', duration: '' }] },
      render(p) {
        return '<div class="cs-wrap">' + head(p) + '<ol class="cs-steps">' +
          (p.items || []).map((it, i) => '<li><span class="cs-steps__n">' + (i + 1) + '</span><h3 class="cs-h3">' + e(it.title) + '</h3>' + (it.text ? '<p>' + e(it.text) + '</p>' : '') + (it.duration ? '<span class="cs-chip">' + U.icon('clock') + e(it.duration) + '</span>' : '') + '</li>').join('') +
          '</ol></div>';
      },
    },

    jobs: {
      label: 'Liste des offres', icon: 'briefcase', desc: 'Les offres publiées, avec recherche et filtres',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'intro', label: 'Introduction', type: 'textarea', rows: 2 },
        { key: 'filters', label: 'Afficher la recherche et les filtres', type: 'toggle' },
        { key: 'groupBy', label: 'Regrouper', type: 'select', options: [{ value: 'none', label: 'Ne pas regrouper' }, { value: 'department', label: 'Par équipe' }, { value: 'location', label: 'Par lieu' }] },
        { key: 'limit', label: 'Nombre maximum d’offres (0 = toutes)', type: 'number' },
      ],
      defaults: { title: 'Nos offres', intro: '', filters: true, groupBy: 'none', limit: 0 },
      render(p, ctx) {
        return '<div class="cs-wrap">' + head(p) + CS.site.jobsList(ctx, p) + '</div>';
      },
    },

    faq: {
      label: 'Questions fréquentes', icon: 'chat', desc: 'Questions et réponses dépliables',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'items', label: 'Questions', type: 'list', itemLabel: 'q', max: 20, add: { q: 'Nouvelle question', a: '' }, fields: [{ key: 'q', label: 'Question', type: 'text' }, { key: 'a', label: 'Réponse', type: 'textarea', rows: 3 }] },
      ],
      defaults: { title: 'Questions fréquentes', items: [{ q: 'Comment postuler ?', a: 'Choisissez une offre et remplissez le formulaire.' }] },
      render(p) {
        return '<div class="cs-wrap cs-narrow">' + head(p) + '<div class="cs-faq">' +
          (p.items || []).map((it) => '<details><summary>' + e(it.q) + U.icon('down', 'i cs-faq__chev') + '</summary><p>' + e(it.a) + '</p></details>').join('') +
          '</div></div>';
      },
    },

    cta: {
      label: 'Appel à l’action', icon: 'send', desc: 'Encadré avec un bouton (candidature spontanée…)',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'text', label: 'Texte', type: 'textarea', rows: 2 },
        { key: 'buttonLabel', label: 'Bouton', type: 'text' },
        { key: 'action', label: 'Action', type: 'select', options: ACTIONS },
      ],
      defaults: { title: 'Envie de nous rejoindre ?', text: '', buttonLabel: 'Candidature spontanée', action: 'spontaneous' },
      defaultBg: 'primary',
      render(p) {
        return '<div class="cs-wrap cs-cta"><div><h2 class="cs-h2">' + e(p.title) + '</h2>' + (p.text ? '<p class="cs-intro">' + e(p.text) + '</p>' : '') + '</div>' + btn(p.buttonLabel, p.action, 'accent') + '</div>';
      },
    },
  };

  /* Ordre d'affichage dans la bibliothèque de blocs */
  const ORDER = ['hero', 'text', 'textImage', 'stats', 'values', 'benefits', 'gallery', 'video', 'testimonials', 'process', 'jobs', 'faq', 'cta'];

  const BACKGROUNDS = [
    { value: 'default', label: 'Fond de page' },
    { value: 'surface', label: 'Fond doux' },
    { value: 'primary', label: 'Couleur principale' },
    { value: 'accent', label: 'Couleur d’accent' },
  ];

  CS.blocks = { BLOCKS, ORDER, BACKGROUNDS, ACTIONS };
})();

</script>
<script>
/* Moteur du site carrière : transforme les données (thème, blocs, offres, formulaire) en pages.
   Le même moteur sert l'aperçu de l'éditeur et le site public. */
window.CS = window.CS || {};
CS.config = CS.config || { allowEmbeds: true };

(function () {
  const U = CS.U;
  const e = U.esc;
  const site = {};

  /* ---------- Thème -> variables CSS ---------- */
  const fontCss = (name) => {
    const f = CS.data.FONTS.find((x) => x.name === name);
    return f ? f.css : "'" + String(name).replace(/'/g, '') + "', system-ui, sans-serif";
  };
  const loadedFonts = {};
  site.loadFonts = (theme) => {
    [theme.fonts.heading, theme.fonts.body].forEach((name) => {
      const f = CS.data.FONTS.find((x) => x.name === name);
      if (!f || f.local || loadedFonts[name]) return;
      loadedFonts[name] = true;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name).replace(/%20/g, '+') + ':wght@400;500;600;700&display=swap';
      document.head.appendChild(link);
    });
  };

  site.themeVars = (theme) => {
    const c = theme.colors;
    const radius = { arrondi: ['24px', '16px'], doux: ['14px', '10px'], carre: ['4px', '3px'] }[theme.radius] || ['24px', '16px'];
    const btnRadius = { pilule: '999px', arrondi: '12px', carre: '4px' }[theme.buttons] || '999px';
    const onPrimary = U.onColor(c.primary, c.text, '#FFFFFF');
    const onAccent = U.onColor(c.accent, U.contrast(c.accent, c.primary) > 4.5 ? c.primary : c.text, '#FFFFFF');
    /* Accent utilisé comme couleur de texte/lien sur fond clair : on garde la principale si l'accent est trop pâle */
    const linkOnBg = U.contrast(c.accent, c.background) >= 3 ? c.accent : c.primary;
    /* Bouton "accent" posé sur un fond clair : s'il se confond avec le fond, on bascule sur la principale */
    const accentVisible = U.contrast(c.accent, c.background) >= 1.6;
    const accentLightBg = accentVisible ? c.accent : c.primary;
    const accentLightOn = accentVisible ? onAccent : onPrimary;
    const vars = {
      '--cs-primary': c.primary,
      '--cs-on-primary': onPrimary,
      '--cs-accent': c.accent,
      '--cs-on-accent': onAccent,
      '--cs-text': c.text,
      '--cs-bg': c.background,
      '--cs-surface': c.surface,
      '--cs-link': linkOnBg,
      '--cs-accent-light-bg': accentLightBg,
      '--cs-accent-light-on': accentLightOn,
      '--cs-muted': U.mix(c.text, c.background, 0.38),
      '--cs-line': U.mix(c.text, c.background, 0.86),
      '--cs-primary-soft': U.mix(c.primary, c.background, 0.9),
      '--cs-radius': radius[0],
      '--cs-radius-sm': radius[1],
      '--cs-btn-radius': btnRadius,
      '--cs-font-h': fontCss(theme.fonts.heading),
      '--cs-font-b': fontCss(theme.fonts.body),
    };
    return Object.keys(vars).map((k) => k + ':' + vars[k]).join(';');
  };

  site.logoSrc = (theme, onDark) => {
    if (theme.logo === 'profilr') return U.profilrLogo(onDark ? '#DFFFA5' : theme.colors.primary);
    return theme.logo || '';
  };
  const logoHTML = (theme) => {
    const src = site.logoSrc(theme);
    return src
      ? '<img class="cs-logo" src="' + e(src) + '" alt="' + e(theme.companyName) + '" style="height:' + (Number(theme.logoHeight) || 30) + 'px">'
      : '<span class="cs-wordmark">' + e(theme.companyName || 'Votre entreprise') + '</span>';
  };

  /* ---------- Offres ---------- */
  site.isLive = (job) => job.status === 'published' && (!job.closesAt || new Date(job.closesAt + 'T23:59:59') >= new Date());
  site.liveJobs = (data) => data.jobs.filter(site.isLive);
  const remoteLabel = (id) => (CS.data.REMOTE.find((r) => r.id === id) || {}).label || '';
  site.salaryLabel = (j) => {
    if (!j.salaryVisible || !j.salaryMin) return '';
    const a = U.fmtK(j.salaryMin), b = U.fmtK(j.salaryMax);
    return (b && j.salaryMax > j.salaryMin ? a.replace(' k', '') + ' – ' + b : a) + '€ brut / an';
  };
  const jobChips = (j, withSalary) => {
    const chips = [
      j.location && [U.icon('pin'), j.location],
      j.contract && [U.icon('briefcase'), j.contract],
      j.remote && [U.icon('home'), remoteLabel(j.remote)],
      withSalary && site.salaryLabel(j) && [U.icon('euro'), site.salaryLabel(j)],
    ].filter(Boolean);
    return chips.map((c) => '<span class="cs-chip">' + c[0] + e(c[1]) + '</span>').join('');
  };

  site.jobsList = (ctx, p) => {
    let jobs = site.liveJobs(ctx.data).slice().sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt)));
    const limit = Number(p.limit) || 0;
    if (limit) jobs = jobs.slice(0, limit);
    if (!jobs.length)
      return '<div class="cs-empty">' + U.icon('briefcase') + '<p><strong>Aucune offre ouverte pour le moment.</strong><br>Envoyez-nous une candidature spontanée, nous la lirons avec attention.</p>' +
        '<a class="cs-btn cs-btn--main" href="#" data-go="spontaneous">Candidature spontanée</a></div>';
    const uniq = (k) => Array.from(new Set(jobs.map((j) => j[k]).filter(Boolean))).sort();
    const sel = (k, label, opts) =>
      opts.length > 1
        ? '<label class="cs-field cs-field--inline"><span class="cs-sr">' + label + '</span><select data-filter="' + k + '"><option value="">' + label + '</option>' + opts.map((o) => '<option value="' + e(o.value || o) + '">' + e(o.label || o) + '</option>').join('') + '</select></label>'
        : '';
    const filters = p.filters
      ? '<div class="cs-filters" role="search"><label class="cs-search">' + U.icon('search') + '<span class="cs-sr">Rechercher une offre</span><input type="search" data-filter="q" placeholder="Rechercher un poste, une compétence…"></label>' +
        sel('department', 'Toutes les équipes', uniq('department')) +
        sel('location', 'Tous les lieux', uniq('location')) +
        sel('contract', 'Tous les contrats', uniq('contract')) +
        sel('remote', 'Télétravail', uniq('remote').map((r) => ({ value: r, label: remoteLabel(r) }))) +
        '</div>'
      : '';
    const card = (j) =>
      '<a class="cs-job" href="#" data-go="job:' + e(j.id) + '" data-q="' + e((j.title + ' ' + j.department + ' ' + j.summary + ' ' + U.mdText(j.description)).toLowerCase()) + '" data-department="' + e(j.department) + '" data-location="' + e(j.location) + '" data-contract="' + e(j.contract) + '" data-remote="' + e(j.remote) + '">' +
      '<div class="cs-job__main"><span class="cs-job__dept">' + e(j.department) + '</span><h3 class="cs-job__title">' + e(j.title) + '</h3><div class="cs-chips">' + jobChips(j, false) + '</div></div>' +
      '<span class="cs-job__go">' + U.icon('arrow') + '</span></a>';
    let list;
    if (p.groupBy && p.groupBy !== 'none') {
      const groups = {};
      jobs.forEach((j) => { const k = j[p.groupBy] || 'Autres'; (groups[k] = groups[k] || []).push(j); });
      list = Object.keys(groups).sort().map((k) => '<div class="cs-jobgroup" data-group><h3 class="cs-jobgroup__title">' + e(k) + ' <span>' + groups[k].length + '</span></h3><div class="cs-jobs">' + groups[k].map(card).join('') + '</div></div>').join('');
    } else list = '<div class="cs-jobs">' + jobs.map(card).join('') + '</div>';
    return '<div data-jobs>' + filters + '<p class="cs-count" aria-live="polite"><span data-count>' + jobs.length + '</span> offre' + (jobs.length > 1 ? 's' : '') + ' ouverte' + (jobs.length > 1 ? 's' : '') + '</p>' + list +
      '<div class="cs-empty" data-noresult hidden>' + U.icon('search') + '<p><strong>Aucune offre ne correspond à ces critères.</strong><br>Essayez d’élargir la recherche, ou envoyez une candidature spontanée.</p></div></div>';
  };

  const filterJobs = (box) => {
    const vals = {};
    box.querySelectorAll('[data-filter]').forEach((el) => (vals[el.dataset.filter] = el.value.trim().toLowerCase()));
    let n = 0;
    box.querySelectorAll('.cs-job').forEach((card) => {
      const ok = (!vals.q || card.dataset.q.indexOf(vals.q) >= 0) &&
        ['department', 'location', 'contract', 'remote'].every((k) => !vals[k] || card.dataset[k].toLowerCase() === vals[k]);
      card.hidden = !ok;
      if (ok) n++;
    });
    box.querySelectorAll('[data-group]').forEach((g) => (g.hidden = !g.querySelector('.cs-job:not([hidden])')));
    const c = box.querySelector('[data-count]');
    if (c) c.parentNode.innerHTML = '<span data-count>' + n + '</span> offre' + (n > 1 ? 's' : '') + ' ' + (n > 1 ? 'correspondent' : 'correspond');
    const nr = box.querySelector('[data-noresult]');
    if (nr) nr.hidden = n > 0;
  };

  /* Données structurées schema.org JobPosting, lues par Google for Jobs */
  site.jobPostingLD = (job, data) => {
    const t = data.theme, s = data.settings;
    const ld = {
      '@context': 'https://schema.org/',
      '@type': 'JobPosting',
      title: job.title,
      description: U.md(job.description),
      datePosted: (job.publishedAt || new Date().toISOString()).slice(0, 10),
      employmentType: { CDI: 'FULL_TIME', CDD: 'TEMPORARY', Stage: 'INTERN', Alternance: 'INTERN', Freelance: 'CONTRACTOR' }[job.contract] || 'FULL_TIME',
      hiringOrganization: { '@type': 'Organization', name: t.companyName, sameAs: site.publicUrl(s) },
      jobLocation: { '@type': 'Place', address: { '@type': 'PostalAddress', addressLocality: job.location, addressCountry: 'FR' } },
      directApply: true,
    };
    if (job.closesAt) ld.validThrough = job.closesAt + 'T23:59:59';
    if (job.remote === 'remote') { ld.jobLocationType = 'TELECOMMUTE'; ld.applicantLocationRequirements = { '@type': 'Country', name: 'France' }; }
    if (job.salaryMin) ld.baseSalary = { '@type': 'MonetaryAmount', currency: 'EUR', value: { '@type': 'QuantitativeValue', minValue: job.salaryMin, maxValue: job.salaryMax || job.salaryMin, unitText: 'YEAR' } };
    return ld;
  };
  site.publicUrl = (s) => 'https://' + (s.customDomain || (s.slug || 'entreprise') + '.jobs.profilr.eu');

  /* ---------- Formulaire de candidature ---------- */
  const field = (id, label, input, req, hint) =>
    '<div class="cs-field"><label for="' + id + '">' + e(label) + (req ? ' <span class="cs-req" aria-hidden="true">*</span>' : ' <span class="cs-opt">(facultatif)</span>') + '</label>' + input +
    (hint ? '<p class="cs-hint">' + e(hint) + '</p>' : '') + '<p class="cs-error" data-error-for="' + id + '" hidden></p></div>';

  site.applyForm = (ctx, job) => {
    const f = ctx.data.form;
    const pre = ctx.idPrefix || 'ap';
    const id = (k) => pre + '-' + k;
    const st = (k) => f.fields[k] || 'off';
    const inp = (k, type, auto, req) => '<input id="' + id(k) + '" name="' + k + '" type="' + type + '" autocomplete="' + auto + '"' + (req ? ' required' : '') + '>';
    let h = '<form class="cs-form" data-apply="' + e(job ? job.id : '') + '" novalidate>';
    h += '<div class="cs-form__row">' + field(id('firstName'), 'Prénom', inp('firstName', 'text', 'given-name', true), true) + field(id('lastName'), 'Nom', inp('lastName', 'text', 'family-name', true), true) + '</div>';
    h += '<div class="cs-form__row">' + field(id('email'), 'E-mail', inp('email', 'email', 'email', true), true) +
      (st('phone') !== 'off' ? field(id('phone'), 'Téléphone', inp('phone', 'tel', 'tel', st('phone') === 'required'), st('phone') === 'required') : '') + '</div>';
    if (st('linkedin') !== 'off') h += field(id('linkedin'), 'Profil LinkedIn', '<input id="' + id('linkedin') + '" name="linkedin" type="url" placeholder="https://www.linkedin.com/in/…"' + (st('linkedin') === 'required' ? ' required' : '') + '>', st('linkedin') === 'required');
    if (st('cv') !== 'off')
      h += field(id('cv'), 'CV',
        '<label class="cs-file" for="' + id('cv') + '">' + U.icon('upload') + '<span data-file-label>Déposez votre CV ou <u>parcourez vos fichiers</u></span><input id="' + id('cv') + '" name="cv" type="file" accept=".pdf,.doc,.docx,.odt"' + (st('cv') === 'required' ? ' required' : '') + '></label>',
        st('cv') === 'required', 'PDF, Word ou ODT, 10 Mo maximum.');
    if (st('coverLetter') !== 'off') h += field(id('coverLetter'), 'Quelques mots sur votre motivation', '<textarea id="' + id('coverLetter') + '" name="coverLetter" rows="5"' + (st('coverLetter') === 'required' ? ' required' : '') + '></textarea>', st('coverLetter') === 'required');
    (f.questions || []).forEach((q) => {
      const qid = id(q.id);
      let input;
      if (q.type === 'textarea') input = '<textarea id="' + qid + '" name="' + e(q.id) + '" rows="3"' + (q.required ? ' required' : '') + '></textarea>';
      else if (q.type === 'select') input = '<select id="' + qid + '" name="' + e(q.id) + '"' + (q.required ? ' required' : '') + '><option value="">Choisir…</option>' + (q.options || []).map((o) => '<option>' + e(o) + '</option>').join('') + '</select>';
      else if (q.type === 'yesno') input = '<div class="cs-radios" role="radiogroup" id="' + qid + '">' + ['Oui', 'Non'].map((o, i) => '<label><input type="radio" name="' + e(q.id) + '" value="' + o + '"' + (q.required && !i ? ' required' : '') + '> ' + o + '</label>').join('') + '</div>';
      else input = '<input id="' + qid + '" name="' + e(q.id) + '" type="text"' + (q.required ? ' required' : '') + '>';
      h += field(qid, q.label, input, q.required);
    });
    const privacy = ctx.data.settings.privacyUrl ? ' <a href="' + e(ctx.data.settings.privacyUrl) + '" target="_blank" rel="noopener">Politique de confidentialité</a>' : '';
    h += '<div class="cs-field cs-check"><label><input type="checkbox" name="consent" id="' + id('consent') + '" required> <span>' + e(f.consent) + privacy + '</span></label><p class="cs-error" data-error-for="' + id('consent') + '" hidden></p></div>';
    if (f.talentPoolOptIn) h += '<div class="cs-field cs-check"><label><input type="checkbox" name="talentPool" id="' + id('talentPool') + '" checked> <span>Me proposer d’autres offres qui pourraient me correspondre.</span></label></div>';
    h += '<div class="cs-form__submit"><button type="submit" class="cs-btn cs-btn--main">' + (job ? 'Envoyer ma candidature' : 'Envoyer ma candidature spontanée') + '</button><p class="cs-hint">Les champs marqués d’un astérisque sont obligatoires.</p></div>';
    return h + '</form>';
  };

  const showError = (form, inputId, msg) => {
    const p = form.querySelector('[data-error-for="' + inputId + '"]');
    if (p) { p.textContent = msg; p.hidden = !msg; }
    const el = form.querySelector('#' + CSS.escape(inputId));
    if (el) el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  };

  const submitApply = (form, ctl) => {
    const data = ctl.getData();
    const f = data.form;
    const jobId = form.dataset.apply || null;
    const job = jobId ? data.jobs.find((j) => j.id === jobId) : null;
    const fd = (name) => {
      const el = form.elements[name];
      if (!el) return '';
      if (el instanceof RadioNodeList) return el.value || '';
      return el.type === 'checkbox' ? el.checked : (el.value || '').trim();
    };
    const pre = form.querySelector('input').id.split('-')[0];
    const id = (k) => pre + '-' + k;
    let firstBad = null;
    const check = (k, ok, msg) => {
      showError(form, id(k), ok ? '' : msg);
      if (!ok && !firstBad) firstBad = form.querySelector('#' + CSS.escape(id(k)));
    };
    check('firstName', fd('firstName'), 'Indiquez votre prénom.');
    check('lastName', fd('lastName'), 'Indiquez votre nom.');
    check('email', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(fd('email')), 'Saisissez une adresse e-mail valide, par exemple prenom@domaine.fr.');
    if (f.fields.phone === 'required') check('phone', fd('phone').replace(/\D/g, '').length >= 9, 'Indiquez un numéro de téléphone.');
    if (f.fields.linkedin === 'required') check('linkedin', fd('linkedin'), 'Indiquez l’adresse de votre profil LinkedIn.');
    const cvEl = form.elements.cv;
    const cv = cvEl && cvEl.files && cvEl.files[0];
    if (cvEl) {
      if (cv && cv.size > 10 * 1024 * 1024) check('cv', false, 'Ce fichier dépasse 10 Mo. Envoyez une version plus légère.');
      else check('cv', f.fields.cv !== 'required' || cv, 'Ajoutez votre CV pour continuer.');
    }
    if (f.fields.coverLetter === 'required') check('coverLetter', fd('coverLetter'), 'Écrivez quelques mots sur votre motivation.');
    const answers = {};
    let knockedOut = false;
    (f.questions || []).forEach((q) => {
      const v = fd(q.id);
      answers[q.id] = v;
      if (q.required) check(q.id, v, 'Cette question est obligatoire.');
      if (q.knockout && v && v === q.knockout) knockedOut = true;
    });
    check('consent', fd('consent'), 'Vous devez accepter le traitement de vos données pour envoyer votre candidature.');
    if (firstBad) { firstBad.focus(); return; }
    const app = {
      id: U.uid('a_'), jobId: job ? job.id : null, createdAt: new Date().toISOString(), status: 'Nouveau',
      source: ctl.mode === 'editor' ? 'Aperçu de l’éditeur' : 'Site carrière',
      firstName: fd('firstName'), lastName: fd('lastName'), email: fd('email'), phone: fd('phone'), linkedin: fd('linkedin'), coverLetter: fd('coverLetter'),
      cv: cv ? { name: cv.name, size: cv.size } : null, answers, knockedOut, talentPool: !!fd('talentPool'),
      projectId: job ? job.projectId : 'p-199',
    };
    ctl.onApply && ctl.onApply(app);
    ctl.go({ name: 'done', id: app.jobId, firstName: app.firstName });
  };

  /* ---------- Pages ---------- */
  const header = (ctx) => {
    const blocks = ctx.data.pages[0].blocks.filter((b) => !b.hidden && b.menu);
    return '<header class="cs-header"><div class="cs-wrap cs-header__in"><a href="#" class="cs-header__logo" data-go="home" aria-label="Accueil – ' + e(ctx.data.theme.companyName) + '">' + logoHTML(ctx.data.theme) + '</a>' +
      '<nav class="cs-nav" aria-label="Menu principal">' + blocks.map((b) => '<a href="#" data-go="sec:' + e(b.id) + '">' + e(b.menu) + '</a>').join('') + '</nav>' +
      '<a class="cs-btn cs-btn--main cs-btn--sm" href="#" data-go="jobs">Voir les offres</a></div></header>';
  };
  const footer = (ctx) => {
    const s = ctx.data.settings, t = ctx.data.theme;
    return '<footer class="cs-footer"><div class="cs-wrap cs-footer__in"><div>' + logoHTML(t) + '<p>© ' + new Date().getFullYear() + ' ' + e(t.companyName) + '</p></div>' +
      '<nav aria-label="Liens légaux"><a href="#" data-go="jobs">Offres</a><a href="#" data-go="spontaneous">Candidature spontanée</a>' + (s.privacyUrl ? '<a href="' + e(s.privacyUrl) + '" target="_blank" rel="noopener">Confidentialité</a>' : '') + '</nav>' +
      (s.showPoweredBy ? '<p class="cs-powered">Site carrière propulsé par <strong>Profilr</strong></p>' : '') + '</div></footer>';
  };

  const sectionHTML = (b, ctx) => {
    const def = CS.blocks.BLOCKS[b.type];
    if (!def) return '';
    let inner;
    try { inner = def.render(b.props || {}, ctx); } catch (err) { inner = '<div class="cs-wrap"><p class="cs-empty">Ce bloc n’a pas pu s’afficher.</p></div>'; console.error(err); }
    const editor = ctx.mode === 'editor';
    return '<section class="cs-sec cs-sec--' + b.type + ' cs-bg-' + (b.bg || 'default') + (editor && ctx.selectedId === b.id ? ' is-selected' : '') + '" id="sec-' + e(b.id) + '" data-block="' + e(b.id) + '"' +
      (editor ? ' data-label="' + e(def.label) + '"' : '') + '>' + inner + '</section>';
  };

  const homePage = (ctx) => ctx.data.pages[0].blocks.filter((b) => !b.hidden).map((b) => sectionHTML(b, ctx)).join('') ||
    '<section class="cs-sec"><div class="cs-wrap cs-empty"><p><strong>Cette page est vide.</strong><br>Ajoutez des blocs depuis le panneau de gauche.</p></div></section>';

  const jobsPage = (ctx) => '<section class="cs-sec"><div class="cs-wrap"><h1 class="cs-h1 cs-h1--page">Nos offres</h1>' + site.jobsList(ctx, { filters: true, groupBy: 'none' }) + '</div></section>';

  const jobPage = (ctx, job) => {
    if (!job) return '<section class="cs-sec"><div class="cs-wrap cs-empty"><p><strong>Cette offre n’est plus en ligne.</strong></p><a class="cs-btn cs-btn--main" href="#" data-go="jobs">Voir les offres ouvertes</a></div></section>';
    const draftNote = !site.isLive(job) ? '<p class="cs-draftnote">' + U.icon('eyeOff') + 'Aperçu : cette offre n’est pas visible par les candidats (' + (job.status === 'draft' ? 'brouillon' : job.status === 'archived' ? 'archivée' : 'expirée') + ').</p>' : '';
    const facts = [
      ['Équipe', job.department], ['Lieu', job.location], ['Contrat', job.contract], ['Télétravail', remoteLabel(job.remote)],
      ['Expérience', job.experience], ['Salaire', site.salaryLabel(job)], ['Publiée', job.publishedAt ? U.relDays(job.publishedAt) : ''],
    ].filter((x) => x[1]);
    return draftNote +
      '<section class="cs-sec cs-bg-surface cs-jobhead"><div class="cs-wrap"><a href="#" class="cs-back" data-go="jobs">' + U.icon('back') + 'Toutes les offres</a>' +
      '<p class="cs-eyebrow">' + e(job.department) + '</p><h1 class="cs-h1">' + e(job.title) + '</h1>' + (job.summary ? '<p class="cs-lead">' + e(job.summary) + '</p>' : '') +
      '<div class="cs-chips">' + jobChips(job, true) + '</div></div></section>' +
      '<section class="cs-sec"><div class="cs-wrap cs-jobbody"><article class="cs-prose">' + U.md(job.description) + '</article>' +
      '<aside class="cs-jobaside"><dl>' + facts.map((f) => '<div><dt>' + e(f[0]) + '</dt><dd>' + e(f[1]) + '</dd></div>').join('') + '</dl>' +
      '<a class="cs-btn cs-btn--main cs-btn--block" href="#" data-go="sec:postuler">Postuler</a>' +
      '<button type="button" class="cs-btn cs-btn--ghost cs-btn--block" data-copy-job="' + e(job.id) + '">' + U.icon('link') + 'Copier le lien de l’offre</button></aside></div></section>' +
      '<section class="cs-sec cs-bg-surface" id="sec-postuler"><div class="cs-wrap cs-narrow"><h2 class="cs-h2">Postuler</h2><p class="cs-intro">' + e(job.title) + ' · ' + e(job.location) + '</p>' + site.applyForm(ctx, job) + '</div></section>';
  };

  const spontaneousPage = (ctx) =>
    '<section class="cs-sec cs-bg-surface cs-jobhead"><div class="cs-wrap cs-narrow"><a href="#" class="cs-back" data-go="home">' + U.icon('back') + 'Retour</a><p class="cs-eyebrow">Candidature spontanée</p>' +
    '<h1 class="cs-h1">Parlez-nous de vous</h1><p class="cs-lead">Aucune offre ne vous correspond pour l’instant ? Laissez-nous votre candidature, nous revenons vers vous dès qu’un poste s’ouvre.</p></div></section>' +
    '<section class="cs-sec"><div class="cs-wrap cs-narrow">' + site.applyForm(ctx, null) + '</div></section>';

  const donePage = (ctx, route) => {
    const f = ctx.data.form;
    const job = route.id ? ctx.data.jobs.find((j) => j.id === route.id) : null;
    return '<section class="cs-sec"><div class="cs-wrap cs-narrow cs-done"><span class="cs-done__icon">' + U.icon('check') + '</span>' +
      '<h1 class="cs-h1 cs-h1--page">' + e(f.confirmTitle) + '</h1>' + (job ? '<p class="cs-eyebrow">' + e(job.title) + '</p>' : '') + '<p class="cs-lead">' + e(f.confirmText) + '</p>' +
      '<div class="cs-actions cs-actions--center"><a class="cs-btn cs-btn--main" href="#" data-go="jobs">Voir les autres offres</a><a class="cs-btn cs-btn--ghost" href="#" data-go="home">Retour à l’accueil</a></div></div></section>';
  };

  /* ---------- Rendu complet ---------- */
  site.render = (ctl) => {
    const data = ctl.getData();
    const route = ctl.route || { name: 'home' };
    const ctx = { data, theme: data.theme, mode: ctl.mode, selectedId: ctl.selectedId, idPrefix: ctl.mode === 'editor' ? 'pv' : 'ap' };
    site.loadFonts(data.theme);
    let main;
    if (route.name === 'job') main = jobPage(ctx, data.jobs.find((j) => j.id === route.id));
    else if (route.name === 'spontaneous') main = spontaneousPage(ctx);
    else if (route.name === 'done') main = donePage(ctx, route);
    else if (route.name === 'jobs' && !data.pages[0].blocks.some((b) => b.type === 'jobs' && !b.hidden)) main = jobsPage(ctx);
    else main = homePage(ctx);
    const root = ctl.root;
    root.setAttribute('style', site.themeVars(data.theme));
    root.classList.add('cs-root');
    root.classList.toggle('cs-root--editor', ctl.mode === 'editor');
    root.innerHTML = header(ctx) + '<main class="cs-main">' + main + '</main>' + footer(ctx);
    site.bind(ctl);
    /* Google for Jobs : données structurées de l'offre affichée (site public seulement) */
    if (ctl.mode !== 'editor') {
      let ld = document.getElementById('cs-jobposting');
      const job = route.name === 'job' && data.jobs.find((j) => j.id === route.id && site.isLive(j));
      if (job) {
        if (!ld) { ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'cs-jobposting'; document.head.appendChild(ld); }
        ld.textContent = JSON.stringify(site.jobPostingLD(job, data));
      } else if (ld) ld.remove();
      document.title = job ? job.title + ' – ' + data.theme.companyName : data.settings.siteTitle;
    }
  };

  /* Navigation interne du site : data-go="home | jobs | spontaneous | job:<id> | sec:<id>" */
  site.bind = (ctl) => {
    const root = ctl.root;
    if (root._csBound) return;
    root._csBound = true;
    root.addEventListener('click', (ev) => {
      const embed = ev.target.closest('[data-embed]');
      if (embed) {
        const fr = document.createElement('iframe');
        fr.src = embed.dataset.embed + '?autoplay=1';
        fr.allow = 'autoplay; fullscreen; picture-in-picture';
        fr.allowFullscreen = true;
        fr.title = 'Vidéo';
        fr.className = 'cs-video__el';
        embed.replaceWith(fr);
        return;
      }
      const copy = ev.target.closest('[data-copy-job]');
      if (copy) {
        const url = site.publicUrl(ctl.getData().settings) + '/offres/' + copy.dataset.copyJob;
        const done = () => { copy.lastChild.textContent = 'Lien copié'; setTimeout(() => { copy.lastChild.textContent = 'Copier le lien de l’offre'; }, 1800); };
        try { navigator.clipboard.writeText(url).then(done, () => CS.toast && CS.toast(url)); } catch (err) { CS.toast && CS.toast(url); }
        return;
      }
      const go = ev.target.closest('[data-go]');
      if (go) {
        ev.preventDefault();
        ev.stopPropagation();
        const v = go.dataset.go;
        if (v.indexOf('sec:') === 0) {
          const target = root.querySelector('#sec-' + CSS.escape(v.slice(4)));
          if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
          ctl.go({ name: 'home' }, () => { const t = root.querySelector('#sec-' + CSS.escape(v.slice(4))); t && t.scrollIntoView({ block: 'start' }); });
          return;
        }
        if (v === 'jobs') {
          const jb = ctl.getData().pages[0].blocks.find((b) => b.type === 'jobs' && !b.hidden);
          if (jb) {
            const scrollToJobs = () => { const t = root.querySelector('#sec-' + CSS.escape(jb.id)); t && t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
            if ((ctl.route || {}).name === 'home' || !ctl.route) scrollToJobs();
            else ctl.go({ name: 'home' }, scrollToJobs);
            return;
          }
          return ctl.go({ name: 'jobs' });
        }
        if (v === 'home') return ctl.go({ name: 'home' });
        if (v === 'spontaneous') return ctl.go({ name: 'spontaneous' });
        if (v.indexOf('job:') === 0) return ctl.go({ name: 'job', id: v.slice(4) });
        return;
      }
      if (ctl.mode === 'editor' && ctl.onSelectBlock) {
        const sec = ev.target.closest('[data-block]');
        if (sec && !ev.target.closest('input,select,textarea,label,summary,button,a')) ctl.onSelectBlock(sec.dataset.block);
      }
    });
    root.addEventListener('input', (ev) => {
      const box = ev.target.closest('[data-jobs]');
      if (box && ev.target.dataset.filter) filterJobs(box);
    });
    root.addEventListener('change', (ev) => {
      const box = ev.target.closest('[data-jobs]');
      if (box && ev.target.dataset.filter) filterJobs(box);
      if (ev.target.type === 'file') {
        const label = ev.target.parentNode.querySelector('[data-file-label]');
        const file = ev.target.files[0];
        if (label) label.innerHTML = file ? U.icon('file') + ' ' + e(file.name) + ' <span class="cs-opt">(' + Math.round(file.size / 1024) + ' Ko)</span>' : 'Déposez votre CV ou <u>parcourez vos fichiers</u>';
      }
      const form = ev.target.closest('form[data-apply]');
      if (form && ev.target.id) showError(form, ev.target.id, '');
    });
    root.addEventListener('submit', (ev) => {
      const form = ev.target.closest('form[data-apply]');
      if (!form) return;
      ev.preventDefault();
      submitApply(form, ctl);
    });
  };

  CS.site = site;
})();

</script>
<script>
/* Éditeur du site carrière (côté équipe RH) : page à blocs, offres, formulaire, thème, candidatures, paramètres. */
window.CS = window.CS || {};

(function () {
  const U = CS.U;
  const e = U.esc;
  const store = CS.store;
  const B = () => CS.blocks.BLOCKS;
  const D = () => CS.store.state.draft;

  const ui = {
    tab: 'page',
    blockId: null,
    jobId: null,
    jobFilter: 'all',
    appId: null,
    appJob: '',
    appStatus: '',
    device: 'desktop',
    route: { name: 'home' },
    adding: false,
    open: {} /* éléments de liste dépliés, par chemin */,
    confirm: null /* action destructive en attente de confirmation */,
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  /* ---------- Toast ---------- */
  CS.toast = (msg, kind) => {
    const t = $('#ad-toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'ad-toast is-on' + (kind ? ' ad-toast--' + kind : '');
    clearTimeout(t._h);
    t._h = setTimeout(() => (t.className = 'ad-toast'), kind === 'warn' ? 6000 : 3200);
  };

  /* ---------- Contrôleur de l'aperçu ---------- */
  const preview = {
    mode: 'editor',
    root: null,
    get route() { return ui.route; },
    get selectedId() { return ui.tab === 'page' ? ui.blockId : null; },
    getData: () => D(),
    go(route, after) {
      ui.route = route;
      renderPreview(true);
      const fr = $('.ad-frame');
      if (fr && !after) fr.scrollTo({ top: 0, behavior: 'instant' });
      if (after) requestAnimationFrame(after);
      renderStageBar();
    },
    onSelectBlock(id) {
      ui.tab = 'page';
      ui.blockId = id;
      ui.adding = false;
      renderAll();
    },
    onApply(app) {
      store.mutate((s) => s.applications.unshift(app), { structural: true });
      CS.toast('Candidature de test enregistrée : retrouvez-la dans l’onglet Candidatures.');
    },
  };

  let rafId = 0;
  const renderPreview = (now) => {
    if (!preview.root) return;
    const run = () => { rafId = 0; CS.site.render(preview); };
    if (now) { cancelAnimationFrame(rafId); run(); return; }
    if (!rafId) rafId = requestAnimationFrame(run);
  };

  const scrollPreviewTo = (blockId) => {
    const el = preview.root && preview.root.querySelector('#sec-' + CSS.escape(blockId));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  /* ---------- Champs génériques ----------
     data-bind="scope|chemin" relie un contrôle à l'état. scope : block, job, theme, settings, form, q:<id> */
  const scopeObj = (scope) => {
    const d = D();
    if (scope === 'block') return d.pages[0].blocks.find((b) => b.id === ui.blockId);
    if (scope === 'job') return d.jobs.find((j) => j.id === ui.jobId);
    if (scope === 'theme') return d.theme;
    if (scope === 'settings') return d.settings;
    if (scope === 'form') return d.form;
    return null;
  };
  const bindAttr = (scope, path, extra) => ' data-bind="' + scope + '|' + path + '"' + (extra || '');
  const val = (scope, path) => {
    const o = scopeObj(scope);
    const v = o ? U.getPath(o, path) : '';
    return v == null ? '' : v;
  };

  const fieldWrap = (id, label, control, help, cls) =>
    '<div class="ad-field ' + (cls || '') + '">' + (label ? '<label class="ad-label" for="' + id + '">' + e(label) + '</label>' : '') + control + (help ? '<p class="ad-help">' + help + '</p>' : '') + '</div>';
  let fid = 0;
  const nid = () => 'f' + ++fid;

  const ctrl = {
    text(scope, path, label, o) {
      o = o || {};
      const id = nid();
      return fieldWrap(id, label, '<input class="ad-input" id="' + id + '" type="' + (o.type || 'text') + '" value="' + e(val(scope, path)) + '"' + (o.placeholder ? ' placeholder="' + e(o.placeholder) + '"' : '') + (o.list ? ' list="' + o.list + '"' : '') + bindAttr(scope, path, o.kind ? ' data-kind="' + o.kind + '"' : '') + (o.structural ? ' data-structural' : '') + '>', o.help);
    },
    textarea(scope, path, label, o) {
      o = o || {};
      const id = nid();
      const v = val(scope, path);
      return fieldWrap(id, label, '<textarea class="ad-input" id="' + id + '" rows="' + (o.rows || 3) + '"' + bindAttr(scope, path, o.kind ? ' data-kind="' + o.kind + '"' : '') + (o.counter ? ' data-counter="' + o.counter + '"' : '') + '>' + e(Array.isArray(v) ? v.join('\n') : v) + '</textarea>' +
        (o.counter ? '<p class="ad-counter" data-counter-for="' + id + '">' + String(v).length + ' / ' + o.counter + '</p>' : ''), o.help);
    },
    select(scope, path, label, options, o) {
      o = o || {};
      const id = nid();
      const v = String(val(scope, path));
      return fieldWrap(id, label, '<select class="ad-input" id="' + id + '"' + bindAttr(scope, path) + (o.structural ? ' data-structural' : '') + '>' +
        options.map((op) => { const ov = typeof op === 'object' ? op.value : op; const ol = typeof op === 'object' ? op.label : op; return '<option value="' + e(ov) + '"' + (String(ov) === v ? ' selected' : '') + '>' + e(ol) + '</option>'; }).join('') + '</select>', o.help);
    },
    toggle(scope, path, label, o) {
      o = o || {};
      const id = nid();
      return '<div class="ad-field ad-field--toggle"><label class="ad-switch" for="' + id + '"><input type="checkbox" id="' + id + '"' + (val(scope, path) ? ' checked' : '') + bindAttr(scope, path, ' data-kind="bool"') + (o.structural ? ' data-structural' : '') + '><span class="ad-switch__track" aria-hidden="true"></span><span>' + e(label) + '</span></label>' + (o.help ? '<p class="ad-help">' + o.help + '</p>' : '') + '</div>';
    },
    segmented(scope, path, label, options, o) {
      o = o || {};
      const v = String(val(scope, path));
      const name = nid();
      return '<div class="ad-field"><span class="ad-label" id="' + name + '-l">' + e(label) + '</span><div class="ad-seg" role="radiogroup" aria-labelledby="' + name + '-l">' +
        options.map((op) => '<label class="ad-seg__opt"><input type="radio" name="' + name + '" value="' + e(op.value) + '"' + (op.value === v ? ' checked' : '') + bindAttr(scope, path) + (o.structural ? ' data-structural' : '') + '><span>' + e(op.label) + '</span></label>').join('') +
        '</div>' + (o.help ? '<p class="ad-help">' + o.help + '</p>' : '') + '</div>';
    },
    color(scope, path, label, help) {
      const id = nid();
      const v = val(scope, path);
      return '<div class="ad-field ad-field--color"><label class="ad-label" for="' + id + '">' + e(label) + '</label><div class="ad-color"><input type="color" aria-label="' + e(label) + ' (sélecteur)" value="' + e(U.isHex(v) ? (v.length === 4 ? '#' + v.slice(1).split('').map((c) => c + c).join('') : v) : '#000000') + '"' + bindAttr(scope, path, ' data-kind="color"') + '><input class="ad-input ad-input--mono" id="' + id + '" value="' + e(v) + '" maxlength="7" spellcheck="false"' + bindAttr(scope, path, ' data-kind="color"') + '></div>' + (help ? '<p class="ad-help">' + help + '</p>' : '') + '</div>';
    },
    image(scope, path, label, o) {
      o = o || {};
      const v = val(scope, path);
      const th = D().theme;
      const has = v && !U.isPlaceholder(v);
      return '<div class="ad-field"><span class="ad-label">' + e(label) + '</span><div class="ad-image">' +
        (v || !o.optional ? '<img src="' + e(U.imgSrc(v, th, 4 / 3)) + '" alt="">' : '<span class="ad-image__none">' + U.icon('image') + '</span>') +
        '<div class="ad-image__actions"><label class="ad-btn ad-btn--sm">' + U.icon('upload') + 'Importer<input type="file" accept="image/*" hidden data-image="' + scope + '|' + path + '"></label>' +
        '<button type="button" class="ad-btn ad-btn--sm ad-btn--quiet" data-act="ph" data-target="' + scope + '|' + path + '">' + (has ? 'Visuel d’exemple' : 'Autre exemple') + '</button>' +
        (o.optional && v ? '<button type="button" class="ad-btn ad-btn--sm ad-btn--quiet" data-act="img-clear" data-target="' + scope + '|' + path + '">Retirer</button>' : '') +
        '</div></div>' + (!has && (v || !o.optional) ? '<p class="ad-help">Visuel d’exemple aux couleurs du thème. Importez vos photos pour le remplacer.</p>' : '') + '</div>';
    },
    icon(scope, path, label) {
      const v = val(scope, path);
      const name = nid();
      return '<div class="ad-field"><span class="ad-label">' + e(label) + '</span><div class="ad-icons" role="radiogroup" aria-label="' + e(label) + '">' +
        U.ICON_CHOICES.map((ic) => '<label class="ad-icons__opt" title="' + ic + '"><input type="radio" name="' + name + '" value="' + ic + '"' + (ic === v ? ' checked' : '') + bindAttr(scope, path) + '><span>' + U.icon(ic) + '</span></label>').join('') + '</div></div>';
    },
    video(scope, path, label, help) {
      const id = nid();
      const v = String(val(scope, path));
      const isBlob = v.indexOf('blob:') === 0;
      return fieldWrap(id, label, '<input class="ad-input" id="' + id + '" type="url" placeholder="https://www.youtube.com/watch?v=…" value="' + e(isBlob ? '' : v) + '"' + bindAttr(scope, path) + '>' +
        '<div class="ad-row"><label class="ad-btn ad-btn--sm">' + U.icon('upload') + 'Importer un fichier vidéo<input type="file" accept="video/mp4,video/webm" hidden data-video="' + scope + '|' + path + '"></label>' + (isBlob ? '<span class="ad-chip ad-chip--ok">Fichier importé</span>' : '') + '</div>',
        e(help || '') + (isBlob ? '<br>Dans ce prototype, le fichier vidéo n’est conservé que jusqu’au rechargement de la page.' : ''));
    },
  };

  /* Liste d'éléments éditables (chiffres, valeurs, témoignages…) */
  const listField = (scope, f, items) => {
    const base = 'props.' + f.key;
    let h = '<div class="ad-field"><div class="ad-listhead"><span class="ad-label">' + e(f.label) + ' <span class="ad-muted">(' + items.length + ')</span></span></div><div class="ad-items">';
    items.forEach((it, i) => {
      const path = base + '.' + i;
      const open = ui.open[ui.blockId + ':' + path];
      const title = it[f.itemLabel] || it.title || it.caption || 'Élément ' + (i + 1);
      h += '<details class="ad-item"' + (open ? ' open' : '') + ' data-open-key="' + e(ui.blockId + ':' + path) + '"><summary><span class="ad-item__title">' + e(U.mdText(title)) + '</span>' +
        '<span class="ad-item__tools"><button type="button" class="ad-iconbtn" data-act="item-up" data-list="' + base + '" data-i="' + i + '" aria-label="Monter"' + (i === 0 ? ' disabled' : '') + '>' + U.icon('up') + '</button>' +
        '<button type="button" class="ad-iconbtn" data-act="item-down" data-list="' + base + '" data-i="' + i + '" aria-label="Descendre"' + (i === items.length - 1 ? ' disabled' : '') + '>' + U.icon('down') + '</button>' +

  const appDrawer = () => {

    const qs = d.form.questions || [];
    const rows = [
      ['E-mail', a.email], ['Téléphone', a.phone], ['LinkedIn', a.linkedin],
      ['CV', a.cv ? a.cv.name + ' (' + Math.max(1, Math.round(a.cv.size / 1024)) + ' Ko)' : ''],
    ].filter((r) => r[1]);
    const answers = Object.keys(a.answers || {}).filter((k) => a.answers[k]).map((k) => {
      const q = qs.find((x) => x.id === k);

    }).join('');

      '<h4 class="ad-sectitle">Dans Profilr</h4><ul class="ad-checks"><li>' + U.icon('check') + 'Profil créé et dédoublonné par e-mail</li><li>' + U.icon('check') + 'Ajouté au projet « ' + e(proj ? proj.name : 'Vivier') + ' »</li><li>' + U.icon(a.talentPool ? 'check' : 'x') + (a.talentPool ? 'Accepte d’être recontacté pour d’autres offres' : 'Ne souhaite pas entrer dans le vivier') + '</li><li>' + U.icon('check') + 'Consentement RGPD enregistré · conservation ' + e(d.settings.retentionMonths) + ' mois</li></ul>' +
      '<div class="ad-row"><a class="ad-btn ad-btn--sm" href="https://app.profilr.eu/profiles" target="_blank" rel="noopener">' + U.icon('external') + 'Ouvrir dans Profilr</a>' +

        : '<button type="button" class="ad-btn ad-btn--sm ad-btn--danger-quiet" data-act="app-del" data-id="' + e(a.id) + '">' + U.icon('trash') + 'Supprimer (droit à l’effacement)</button>') + '</div></aside>';

  /* ---------- Rendu principal ---------- */
  const renderStageBar = () => {
    const bar = $('#ad-stagebar');

    if (r.name === 'spontaneous') crumb = 'Candidature spontanée';

      '<div class="ad-seg ad-seg--icons" role="radiogroup" aria-label="Taille de l’aperçu">' + [['desktop', 'monitor', 'Ordinateur'], ['tablet', 'tablet', 'Tablette'], ['mobile', 'phone', 'Mobile']].map((x) =>

  const blocks = () => D().pages[0].blocks;
  const move = (arr, i, j) => { if (j < 0 || j >= arr.length) return; const [x] = arr.splice(i, 1); arr.splice(j, 0, x); };
  const resolveTarget = (t) => { const [scope, path] = t.split('|'); return { obj: scopeObj(scope), path, scope }; };

  const actions = {
    'publish'() {

    'discard'() { ui.confirm = 'discard'; renderTop(); },

    'edit-block'(el) { ui.blockId = el.dataset.id; ui.adding = false; ui.confirm = null; ui.route = { name: 'home' }; renderAll(); scrollPreviewTo(ui.blockId); },

    'add-open'() { ui.adding = true; renderPanel(); const lib = $('.ad-library'); lib && lib.scrollIntoView({ block: 'nearest' }); },
    'add-close'() { ui.adding = false; renderPanel(); },
    'add-block'(el) {
      const def = B()[el.dataset.type];
      const nb = { id: U.uid('b_'), type: el.dataset.type, hidden: false, bg: def.defaultBg || 'default', menu: '', props: U.clone(def.defaults) };
      store.mutate(() => {
        const a = blocks();
        const i = ui.blockId ? a.findIndex((b) => b.id === ui.blockId) : -1;
        if (i >= 0) a.splice(i + 1, 0, nb); else a.push(nb);

        ui.adding = false;
      }, { structural: true });
      requestAnimationFrame(() => scrollPreviewTo(nb.id));
    },

    'item-add'(el) {
      const def = B()[scopeObj('block').type];
      const f = def.fields.find((x) => x.key === el.dataset.field);
      store.mutate(() => {
        const b = scopeObj('block');
        b.props[f.key] = b.props[f.key] || [];
        b.props[f.key].push(U.clone(f.add || {}));
        ui.open[ui.blockId + ':props.' + f.key + '.' + (b.props[f.key].length - 1)] = true;
      }, { structural: true });
    },
    'item-del'(el, ev) { ev.preventDefault(); store.mutate(() => U.getPath(scopeObj('block'), el.dataset.list).splice(+el.dataset.i, 1), { structural: true }); },
    'item-up'(el, ev) { ev.preventDefault(); store.mutate(() => move(U.getPath(scopeObj('block'), el.dataset.list), +el.dataset.i, +el.dataset.i - 1), { structural: true }); },
    'item-down'(el, ev) { ev.preventDefault(); store.mutate(() => move(U.getPath(scopeObj('block'), el.dataset.list), +el.dataset.i, +el.dataset.i + 1), { structural: true }); },
    'ph'(el) {
      const { obj, path } = resolveTarget(el.dataset.target);
      const cur = U.getPath(obj, path);
      const n = U.isPlaceholder(cur) && cur ? (parseInt(cur.split(':')[1], 10) + 1) % 6 : 0;
      store.mutate(() => U.setPath(obj, path, 'ph:' + n), { structural: true });
    },
    'img-clear'(el) { const { obj, path } = resolveTarget(el.dataset.target); store.mutate(() => U.setPath(obj, path, ''), { structural: true }); },

    'job-new'() {
      const j = { id: U.uid('j_'), title: 'Nouvelle offre', department: '', location: '', contract: 'CDI', remote: 'hybrid', experience: '1 à 3 ans', salaryMin: 0, salaryMax: 0, salaryVisible: false, status: 'draft', publishedAt: '', closesAt: '', projectId: '', summary: '', description: '## Vos missions\n- \n\n## Votre profil\n- ' };
      store.mutate((s) => { s.draft.jobs.unshift(j); ui.jobId = j.id; ui.route = { name: 'job', id: j.id }; ui.resetScroll = true; }, { structural: true });

    'back-jobs'() { ui.jobId = null; ui.confirm = null; setTab('jobs'); },

    'job-dup'(el) {
      store.mutate((s) => { const i = s.draft.jobs.findIndex((j) => j.id === el.dataset.id); const nj = U.clone(s.draft.jobs[i]); nj.id = U.uid('j_'); nj.title += ' (copie)'; nj.status = 'draft'; nj.publishedAt = ''; s.draft.jobs.splice(i + 1, 0, nj); ui.jobId = nj.id; ui.route = { name: 'job', id: nj.id }; ui.resetScroll = true; }, { structural: true });

    'job-del-yes'(el) { ui.confirm = null; ui.jobId = null; store.mutate((s) => s.draft.jobs.splice(s.draft.jobs.findIndex((j) => j.id === el.dataset.id), 1), { structural: true }); setTab('jobs'); CS.toast('Offre supprimée. Elle disparaîtra du site à la prochaine publication.'); },

    'q-add'() {
      store.mutate((s) => { s.draft.form.questions.push({ id: U.uid('q_'), label: 'Nouvelle question', type: 'text', options: [], required: false, knockout: '' }); ui.open['form:questions.' + (s.draft.form.questions.length - 1)] = true; }, { structural: true });
    },
    'q-del'(el, ev) { ev.preventDefault(); store.mutate((s) => s.draft.form.questions.splice(+el.dataset.i, 1), { structural: true }); },
    'q-up'(el, ev) { ev.preventDefault(); store.mutate((s) => move(s.draft.form.questions, +el.dataset.i, +el.dataset.i - 1), { structural: true }); },
    'q-down'(el, ev) { ev.preventDefault(); store.mutate((s) => move(s.draft.form.questions, +el.dataset.i, +el.dataset.i + 1), { structural: true }); },

    'preset'(el) {
      const p = CS.data.PRESETS.find((x) => x.id === el.dataset.id);
      store.mutate((s) => { const t = s.draft.theme; t.colors = U.clone(p.theme.colors); t.fonts = U.clone(p.theme.fonts); t.radius = p.theme.radius; t.buttons = p.theme.buttons; }, { structural: true });
    },
    'theme-reset'() { store.mutate((s) => { s.draft.theme = U.clone(CS.data.PROFILR_THEME); }, { structural: true }); CS.toast('Charte Profilr rétablie.'); },
    'logo-profilr'() { store.mutate((s) => { s.draft.theme.logo = 'profilr'; }, { structural: true }); },
    'logo-text'() { store.mutate((s) => { s.draft.theme.logo = ''; }, { structural: true }); },

    'copy-json'() {
      const json = JSON.stringify(D(), null, 2);
      const ok = () => CS.toast('Configuration copiée (' + Math.round(json.length / 1024) + ' Ko).');
      try { navigator.clipboard.writeText(json).then(ok, () => CS.toast('La copie a été refusée par le navigateur.', 'warn')); } catch (err) { CS.toast('La copie a été refusée par le navigateur.', 'warn'); }
    },
    'reset'() { ui.confirm = 'reset'; renderPanel(); },
    'reset-yes'() { ui.confirm = null; ui.blockId = null; ui.jobId = null; ui.route = { name: 'home' }; store.reset(); CS.toast('Démo réinitialisée.'); },

    'app-open'(el) { ui.appId = el.dataset.id; ui.confirm = null; renderAll(); },
    'app-close'() { ui.appId = null; renderAll(); },
    'app-del'(el) { ui.confirm = 'del-app:' + el.dataset.id; renderAll(); },
    'app-del-yes'(el) { ui.confirm = null; ui.appId = null; store.mutate((s) => s.applications.splice(s.applications.findIndex((a) => a.id === el.dataset.id), 1), { structural: true }); CS.toast('Candidature supprimée.'); },
  };

  /* ---------- Saisie dans les champs ---------- */
  const onFieldInput = (el) => {
    const [scope, path] = el.dataset.bind.split('|');
    const obj = scopeObj(scope);
    if (!obj) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    const kind = el.dataset.kind;
    if (kind === 'number') v = el.value === '' ? 0 : Number(el.value);
    if (kind === 'lines') v = el.value.split('\n').map((x) => x.trim()).filter(Boolean);
    if (kind === 'color') {
      if (!U.isHex(v)) return;
      /* garde le sélecteur et le champ texte synchronisés */
      $$('[data-bind="' + el.dataset.bind + '"]', el.closest('.ad-color')).forEach((o) => { if (o !== el) o.value = v.length === 4 ? '#' + v.slice(1).split('').map((c) => c + c).join('') : v; });
      v = v.toUpperCase();
    }
    const structural = el.hasAttribute('data-structural');
    store.mutate(() => U.setPath(obj, path, v), { structural, field: true });
    /* petits retours en direct sans redessiner le panneau */
    if (el.dataset.counter) { const c = $('[data-counter-for="' + el.id + '"]'); if (c) { c.textContent = el.value.length + ' / ' + el.dataset.counter; c.classList.toggle('is-over', el.value.length > +el.dataset.counter); } }
    if (scope === 'theme' && path.indexOf('colors.') === 0) {
      const c = D().theme.colors;
      const p = $('[data-contrast]');
      if (p) { const r = U.contrast(c.text, c.background); p.innerHTML = contrastMsg(r); p.classList.toggle('is-bad', r < 4.5); }
      $$('.ad-swatch__c').forEach(() => {});
    }
    if (path === 'logoHeight') { const o = $('[data-out="logo-h"]'); if (o) o.textContent = v + ' px'; const img = $('.ad-logoprev img'); if (img) img.style.height = v + 'px'; }
    if (scope === 'settings') {
      const s = D().settings;
      const set = (k, t) => { const o = $('[data-out="' + k + '"]'); if (o) o.textContent = t; };
      set('url', CS.site.publicUrl(Object.assign({}, s, { customDomain: '' })).replace('https://', ''));
      set('serp-url', CS.site.publicUrl(s).replace('https://', ''));
      set('serp-title', s.siteTitle);
      set('serp-desc', s.seoDescription);
    }
    if (scope === 'job' && path === 'title') { const t = $('.ad-ptitle'); if (t) t.textContent = el.value || 'Nouvelle offre'; }
    if (scope === 'block' || (scope === 'form' && /\.label$/.test(path))) {
      const det = el.closest('details.ad-item');
      if (det && /\.(title|name|caption|q|value|label)$/.test(path)) { const t = det.querySelector('.ad-item__title'); if (t && t.firstChild) t.firstChild.textContent = el.value || '…'; }
    }
  };

  const onFile = async (el) => {
    const file = el.files && el.files[0];
    if (!file) return;
    try {
      if (el.dataset.logo !== undefined) {
        const src = await U.readImage(file, 600);
        store.mutate((s) => { s.draft.theme.logo = src; }, { structural: true });
        CS.toast('Logo importé.');
      } else if (el.dataset.image) {
        const src = await U.readImage(file, 1600);
        const { obj, path } = resolveTarget(el.dataset.image);
        store.mutate(() => U.setPath(obj, path, src), { structural: true });
      } else if (el.dataset.video) {
        if (!/^video\//.test(file.type)) throw new Error('Choisissez un fichier vidéo MP4 ou WebM.');
        const { obj, path } = resolveTarget(el.dataset.video);
        store.mutate(() => U.setPath(obj, path, URL.createObjectURL(file)), { structural: true });
      }
    } catch (err) {
      CS.toast(err.message || 'Import impossible.', 'warn');
    }
  };

  /* ---------- Glisser-déposer des blocs ---------- */
  const bindDnd = () => {
    const panel = $('#ad-panel');
    let dragId = null;
    panel.addEventListener('dragstart', (ev) => {
      const li = ev.target.closest('.ad-block');
      if (!li) return;
      dragId = li.dataset.id;
      li.classList.add('is-drag');
      ev.dataTransfer.effectAllowed = 'move';
      try { ev.dataTransfer.setData('text/plain', dragId); } catch (err) { /* certains navigateurs */ }
    });
    panel.addEventListener('dragover', (ev) => {
      const li = ev.target.closest('.ad-block');
      if (!dragId || !li) return;
      ev.preventDefault();
      $$('.ad-block', panel).forEach((x) => x.classList.remove('drop-before', 'drop-after'));
      const r = li.getBoundingClientRect();
      li.classList.add(ev.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
    });
    panel.addEventListener('dragend', () => { dragId = null; $$('.ad-block', panel).forEach((x) => x.classList.remove('is-drag', 'drop-before', 'drop-after')); });
    panel.addEventListener('drop', (ev) => {
      const li = ev.target.closest('.ad-block');
      if (!dragId || !li) return;
      ev.preventDefault();
      const after = li.classList.contains('drop-after');
      const targetId = li.dataset.id;
      const id = dragId;
      dragId = null;
      if (targetId === id) return renderPanel();
      store.mutate(() => {
        const a = blocks();
        const [x] = a.splice(a.findIndex((b) => b.id === id), 1);
        let j = a.findIndex((b) => b.id === targetId);
        a.splice(after ? j + 1 : j, 0, x);
      }, { structural: true });
    });
  };

  /* ---------- Mode site public (#site) ---------- */
  const publicCtl = {
    mode: 'public',
    root: null,
    route: { name: 'home' },
    getData: () => store.state.published || D(),
    go(route, after) {
      publicCtl.route = route;
      const h = route.name === 'job' ? 'site-offre-' + route.id : route.name === 'spontaneous' ? 'site-candidature' : route.name === 'done' ? 'site-merci' : 'site';
      if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h);
      CS.site.render(publicCtl);
      if (after) requestAnimationFrame(after); else window.scrollTo(0, 0);
    },
    onApply(app) {
      store.mutate((s) => s.applications.unshift(app), { structural: false });
    },
  };
  const routeFromHash = () => {
    const h = location.hash.slice(1);
    if (h.indexOf('site') !== 0) return null;
    let m = h.match(/^site-offre-(.+)$/);
    if (m) return { name: 'job', id: m[1] };
    if (h === 'site-candidature') return { name: 'spontaneous' };
    return { name: 'home' };
  };
  const applyHash = () => {
    const r = routeFromHash();
    const pub = $('#public');
    const app = $('#app');
    if (r) {
      app.hidden = true;
      pub.hidden = false;
      publicCtl.route = r;
      CS.site.render(publicCtl);
      window.scrollTo(0, 0);
    } else {
      pub.hidden = true;
      app.hidden = false;
      document.title = 'Site carrière · Profilr';
      const ld = document.getElementById('cs-jobposting');
      if (ld) ld.remove();
      renderAll();
    }
  };

  /* ---------- Initialisation ---------- */
  CS.admin = {
    init() {
      store.load();
      preview.root = $('#preview');
      publicCtl.root = $('#public-site');

      store.subscribe((opts) => {
        if (!$('#public').hidden) return;
        if (opts.structural) renderAll();
        else { renderTop(); renderPreview(); if (ui.tab === 'jobs' && ui.jobId) { /* statut de l'offre dans la liste au retour */ } }
      });

      const app = $('#app');
      app.addEventListener('click', (ev) => {
        const tab = ev.target.closest('[data-tab]');
        if (tab) return setTab(tab.dataset.tab);
        const a = ev.target.closest('[data-act]');
        if (a && actions[a.dataset.act] && !a.disabled) actions[a.dataset.act](a, ev);
      });
      app.addEventListener('input', (ev) => {
        const el = ev.target;
        if (el.dataset.bind && el.type !== 'radio' && el.type !== 'checkbox' && el.tagName !== 'SELECT') onFieldInput(el);
      });
      app.addEventListener('change', (ev) => {
        const el = ev.target;
        if (el.type === 'file') return onFile(el);
        if (el.dataset.bind && (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT')) onFieldInput(el);
        if (el.dataset.device !== undefined) { ui.device = el.value; $('#ad-frame').dataset.device = ui.device; }
        if (el.dataset.appfilter) { ui[el.dataset.appfilter === 'job' ? 'appJob' : 'appStatus'] = el.value; renderAll(); }
        if (el.dataset.appstatus) { store.mutate((s) => { const x = s.applications.find((y) => y.id === el.dataset.appstatus); if (x) x.status = el.value; }, { structural: true }); }
      });
      /* garder en mémoire les éléments de liste dépliés */
      app.addEventListener('toggle', (ev) => {
        const d = ev.target;
        if (d.dataset && d.dataset.openKey) ui.open[d.dataset.openKey] = d.open;
      }, true);
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && !$('#app').hidden) {
          if (ui.confirm) { ui.confirm = null; renderAll(); }
          else if (ui.tab === 'apps' && ui.appId) { ui.appId = null; renderAll(); }
          else if (ui.adding) { ui.adding = false; renderPanel(); }
        }
      });
      bindDnd();

      $('#public-back').addEventListener('click', (ev) => { ev.preventDefault(); history.replaceState(null, '', location.pathname + location.search); applyHash(); });
      window.addEventListener('hashchange', applyHash);
      applyHash();
    },
  };
})();

</script>
<script>CS.admin.init();</script>
</body>
</html>
