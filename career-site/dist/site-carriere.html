    },
    {
      id: 'a_s2', jobId: 'j_design', createdAt: daysAgo(1.4), sample: true, status: 'À qualifier', source: 'Google', lang: 'en',
      firstName: 'Mehdi', lastName: 'Laurent', email: 'mehdi.laurent@example.com', phone: '06 00 00 00 00', linkedin: '', coverLetter: 'Votre approche du design centrée sur les recruteurs m’intéresse beaucoup.',
      cv: { name: 'CV-MLaurent.pdf', size: 240000 }, files: { extraFile: { name: 'Portfolio-MLaurent.pdf', size: 8400000, label: 'Portfolio' }, coverLetterFile: { name: 'Lettre-MLaurent.pdf', size: 64000 } },
      answers: { q_start: 'Sous 1 mois', q_auth: 'Oui', q_source: 'Site emploi' }, knockedOut: false, talentPool: true,
    },
    {
      id: 'a_s3', jobId: null, createdAt: daysAgo(3), sample: true, status: 'Nouveau', source: 'Accès direct', lang: 'fr',
      firstName: 'Sofia', lastName: 'Marchetti', email: 'sofia.marchetti@example.com', phone: '', linkedin: '', coverLetter: '',
      cv: { name: 'CV_Sofia_Marchetti.pdf', size: 96000 }, files: {}, answers: { q_start: 'Plus tard', q_auth: 'Non', q_source: 'Événement' }, knockedOut: true, talentPool: false,
    },
  ];

  /* Statistiques d'exemple sur 60 jours, agrégées par jour (pas de données personnelles) */
  const sampleStats = (jobs) => {
    const daily = {};
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const live = jobs.filter((j) => j.status === 'published' && !j.publishAt).map((j) => j.id);
    const weight = { j_backend: 1.3, j_design: 1.6, j_ae: 0.8, j_csm: 1.0 };
    for (let i = 60; i >= 1; i--) {
      const d = new Date(Date.now() - i * 86400000);
      const we = d.getDay() === 0 || d.getDay() === 6;
      const trend = 1 + (60 - i) / 90;
      const visits = Math.round((we ? 28 : 70) * trend * (0.75 + rnd() * 0.5));
      const jobViews = {};
      let jv = 0;
      live.forEach((id) => { const n = Math.round(visits * 0.22 * (weight[id] || 1) * (0.7 + rnd() * 0.6)); jobViews[id] = n; jv += n; });
      const starts = Math.round(jv * (0.16 + rnd() * 0.06));
      const applies = Math.round(starts * (0.42 + rnd() * 0.18));
      const sources = {};
      const mix = [0.31, 0.24, 0.14, 0.11, 0.15, 0.05];
      SOURCES.forEach((s, k) => (sources[s] = Math.round(visits * mix[k] * (0.8 + rnd() * 0.4))));
      const appSources = {};
      let left = applies;
      SOURCES.forEach((s, k) => { const n = k === SOURCES.length - 1 ? left : Math.min(left, Math.round(applies * [0.34, 0.18, 0.2, 0.12, 0.1, 0.06][k])); appSources[s] = n; left -= n; });
      const consentYes = Math.round(visits * 0.71);
      daily[U.dayKey(d)] = { s: 1, visits, pageViews: Math.round(visits * 2.4), jobViews, applyStarts: starts, applies, sources, appSources, consentYes, consentNo: visits - consentYes, langs: { fr: Math.round(visits * 0.82), en: visits - Math.round(visits * 0.82) } };
    }
    return { daily };
  };

  const defaultDraft = () => {
    const pages = [
      { id: 'home', title: 'Accueil', slug: '', inMenu: false, blocks: homeBlocks() },
      { id: 'p_life', title: 'Vie chez nous', slug: 'vie-chez-nous', inMenu: true, blocks: lifeBlocks() },
    ];
    U.ensureIds(pages);
    const jobs = defaultJobs();
    return { settings: defaultSettings(), theme: U.clone(PROFILR_THEME), pages, jobs, form: defaultForm(), i18n: seedEnglish(pages, jobs) };
  };

  const fresh = () => {
    const draft = defaultDraft();
    const v1 = U.clone(draft);
    v1.jobs = v1.jobs.filter((j) => j.id !== 'j_backend' && j.id !== 'j_growth');
    v1.pages.pop();
    return {
      draft,
      published: U.clone(draft),
      publishedAt: daysAgo(3),
      versions: [
        { id: 'v1', n: 1, at: daysAgo(21), author: 'Vous', summary: 'Première mise en ligne', snapshot: v1 },
        { id: 'v2', n: 2, at: daysAgo(3), author: 'Vous', summary: '1 page ajoutée · 2 offres ajoutées', snapshot: U.clone(draft) },
      ],
      applications: sampleApplications(),
      stats: sampleStats(draft.jobs),
    };
  };

  /* Résumé lisible des différences entre deux versions */
  const diffSummary = (a, b2) => {
    if (!a) return 'Première mise en ligne';
    const out = [];
    const ids = (arr) => new Set(arr.map((x) => x.id));
    const cnt = (n, one, many) => n + ' ' + (n > 1 ? many : one);
    const pa = ids(a.pages), pb = ids(b2.pages);
    const pAdd = [...pb].filter((x) => !pa.has(x)).length, pDel = [...pa].filter((x) => !pb.has(x)).length;
    if (pAdd) out.push(cnt(pAdd, 'page ajoutée', 'pages ajoutées'));
    if (pDel) out.push(cnt(pDel, 'page supprimée', 'pages supprimées'));
    const blocksOf = (d) => { const m = {}; d.pages.forEach((p) => p.blocks.forEach((x) => (m[x.id] = JSON.stringify(x)))); return m; };
    const ba = blocksOf(a), bb = blocksOf(b2);
    const bAdd = Object.keys(bb).filter((k) => !(k in ba)).length, bDel = Object.keys(ba).filter((k) => !(k in bb)).length;
    const bMod = Object.keys(bb).filter((k) => k in ba && ba[k] !== bb[k]).length;
    if (bAdd) out.push(cnt(bAdd, 'bloc ajouté', 'blocs ajoutés'));
    if (bDel) out.push(cnt(bDel, 'bloc supprimé', 'blocs supprimés'));
    if (bMod) out.push(cnt(bMod, 'bloc modifié', 'blocs modifiés'));
    const live = (d) => new Set(d.jobs.filter((j) => j.status === 'published').map((j) => j.id));
    const ja = live(a), jb = live(b2);
    const jAdd = [...jb].filter((x) => !ja.has(x)).length, jDel = [...ja].filter((x) => !jb.has(x)).length;
    const jMod = b2.jobs.filter((j) => { const o = a.jobs.find((x) => x.id === j.id); return o && ja.has(j.id) && jb.has(j.id) && JSON.stringify(o) !== JSON.stringify(j); }).length;
    if (jAdd) out.push(cnt(jAdd, 'offre publiée', 'offres publiées'));
    if (jDel) out.push(cnt(jDel, 'offre retirée', 'offres retirées'));
    if (jMod) out.push(cnt(jMod, 'offre modifiée', 'offres modifiées'));
    if (JSON.stringify(a.theme) !== JSON.stringify(b2.theme)) out.push('thème modifié');
    if (JSON.stringify(a.form) !== JSON.stringify(b2.form)) out.push('formulaire modifié');
    if (JSON.stringify(a.i18n) !== JSON.stringify(b2.i18n)) out.push('traductions modifiées');
    if (JSON.stringify(a.settings) !== JSON.stringify(b2.settings)) out.push('paramètres modifiés');
    return out.length ? out.join(' · ') : 'Aucun changement de contenu';
  };

  /* ---------- Store ---------- */
  const MAX_VERSIONS = 15;
  const listeners = [];
  const store = {
    state: null,
    storageOk: true,
    load() {
      let raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { this.storageOk = false; }
      try { this.state = raw ? JSON.parse(raw) : fresh(); } catch (e) { this.state = fresh(); }
      if (!this.state.draft || !this.state.draft.pages || !this.state.versions) this.state = fresh();
      this.state.stats = this.state.stats || { daily: {} };
      return this.state;
    },
    save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.state));
        return true;
      } catch (e) {
        /* stockage plein : on sacrifie d'abord les plus vieilles versions */
        if (this.state.versions && this.state.versions.length > 3) {
          this.state.versions = this.state.versions.slice(-3);
          try { localStorage.setItem(KEY, JSON.stringify(this.state)); CS.toast && CS.toast('Stockage presque plein : seules les 3 dernières versions sont conservées.', 'warn'); return true; } catch (e2) { /* on continue */ }
        }
        if (this.storageOk) CS.toast && CS.toast('Le stockage du navigateur est plein : la dernière modification n’est pas sauvegardée. Utilisez des images plus légères.', 'warn');
        return false;
      }
    },
    saveSoon: null,
    mutate(fn, opts) {
      fn(this.state);
      this.saveSoon();
      listeners.forEach((l) => l(opts || {}));
    },
    subscribe(fn) { listeners.push(fn); },
    reset() {
      this.state = fresh();
      this.save();
      listeners.forEach((l) => l({ structural: true }));
    },
    isDirty() {
      return JSON.stringify(this.state.draft) !== JSON.stringify(this.state.published);
    },
    publish() {
      this.mutate((s) => {
        const now = new Date().toISOString();
        s.draft.jobs.forEach((j) => {
          if (j.status !== 'published') return;
          const scheduled = j.publishAt && new Date(j.publishAt) > new Date();
          if (!j.publishedAt && !scheduled) j.publishedAt = now;
          /* Multidiffusion : en production, Profilr pousse l'offre vers chaque jobboard coché */
          if (j.multipost && (j.jobboards || []).length && !scheduled && !j.diffusedAt) j.diffusedAt = now;
        });
        const summary = diffSummary(s.published, s.draft);
        const n = (s.versions.length ? s.versions[s.versions.length - 1].n : 0) + 1;
        s.versions.push({ id: U.uid('v'), n, at: now, author: 'Vous', summary, snapshot: U.clone(s.draft) });
        if (s.versions.length > MAX_VERSIONS) s.versions = s.versions.slice(-MAX_VERSIONS);
        s.published = U.clone(s.draft);
        s.publishedAt = now;
      }, { structural: true });
    },
    discard() {
      this.mutate((s) => { s.draft = U.clone(s.published); }, { structural: true });
    },
    restore(versionId) {
      const v = this.state.versions.find((x) => x.id === versionId);
      if (!v) return null;
      this.mutate((s) => { s.draft = U.clone(v.snapshot); }, { structural: true });
      return v;
    },
    /* Statistiques : compteurs journaliers, sans donnée personnelle */
    track(field, key, inc) {
      const s = this.state;
      const k = U.dayKey(new Date());
      const day = (s.stats.daily[k] = s.stats.daily[k] || { visits: 0, pageViews: 0, jobViews: {}, applyStarts: 0, applies: 0, sources: {}, appSources: {}, consentYes: 0, consentNo: 0, langs: {} });
      if (key != null) { day[field] = day[field] || {}; day[field][key] = (day[field][key] || 0) + (inc || 1); }
      else day[field] = (day[field] || 0) + (inc || 1);
      this.saveSoon();
    },
  };
  store.saveSoon = U.debounce(() => store.save(), 250);

  CS.store = store;
  CS.data = { PROFILR_THEME, PRESETS, FONTS, PROJECTS, JOBBOARDS, CONTRACTS, REMOTE, EXPERIENCE, APP_STATUSES, SOURCES, defaultForm, diffSummary };
})();

        if (v && v.kind === 'file') {
          media = '<video class="cs-video__el" controls preload="metadata" poster="' + e(poster) + '" src="' + e(v.url) + '"></video>';
        } else if (v && (v.kind === 'youtube' || v.kind === 'vimeo') && CS.config.allowEmbeds) {
          media = '<button type="button" class="cs-video__poster" data-embed="' + e(v.embed) + '" aria-label="' + e(CS.t(ctx.lang, 'playVideo')) + '"><img src="' + e(poster) + '" alt=""><span class="cs-video__play">' + U.icon('play') + '</span></button>';
        } else if (v) {
          media = '<a class="cs-video__poster" href="' + e(v.url) + '" target="_blank" rel="noopener" aria-label="' + e(CS.t(ctx.lang, 'watchVideo')) + '"><img src="' + e(poster) + '" alt=""><span class="cs-video__play">' + U.icon('play') + '</span><span class="cs-video__out">' + e(CS.t(ctx.lang, 'watchVideo')) + ' ' + U.icon('external') + '</span></a>';
        } else {
          media = '<div class="cs-video__poster cs-video__poster--empty"><img src="' + e(poster) + '" alt=""><span class="cs-video__play">' + U.icon('play') + '</span>' +
            (ctx.mode === 'editor' ? '<span class="cs-video__out">Ajoutez un lien YouTube ou Vimeo dans le panneau</span>' : '') + '</div>';
        }
        return '<div class="cs-wrap cs-video">' + (p.title || p.text ? '<div class="cs-video__head">' + head({ title: p.title, intro: p.text }) + '</div>' : '') + '<div class="cs-video__frame">' + media + '</div></div>';
      },
    },

    testimonials: {
      label: 'Témoignages', icon: 'chat', desc: 'Citations de collaborateurs',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'items', label: 'Témoignages', type: 'list', itemLabel: 'name', max: 9, add: { quote: '', name: 'Prénom N.', role: 'Poste', photo: '' }, fields: [{ key: 'quote', label: 'Citation', type: 'textarea', rows: 3 }, { key: 'name', label: 'Nom', type: 'text', noTr: true }, { key: 'role', label: 'Poste', type: 'text' }, { key: 'photo', label: 'Photo', type: 'image', optional: true }] },
      ],
      defaults: { title: 'Ils et elles en parlent', items: [{ quote: 'Ce que j’aime ici, c’est…', name: 'Prénom N.', role: 'Poste', photo: '' }] },
      render(p) {
        return '<div class="cs-wrap">' + head(p) + '<div class="cs-quotes">' +
          (p.items || []).map((it, i) =>
            '<figure class="cs-quote"><blockquote>' + e(it.quote) + '</blockquote><figcaption>' +
            (it.photo && !U.isPlaceholder(it.photo) ? '<img class="cs-avatar" src="' + e(it.photo) + '" alt="">' : '<span class="cs-avatar cs-avatar--' + (i % 3) + '" aria-hidden="true">' + e(initials(it.name)) + '</span>') +
            '<span><strong>' + e(it.name) + '</strong><span>' + e(it.role) + '</span></span></figcaption></figure>'
          ).join('') +
          '</div></div>';
      },
    },

    process: {
      label: 'Process de recrutement', icon: 'flag', desc: 'Les étapes, dans l’ordre',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'intro', label: 'Introduction', type: 'textarea', rows: 2 },
        { key: 'items', label: 'Étapes', type: 'list', itemLabel: 'title', max: 8, add: { title: 'Nouvelle étape', text: '', duration: '' }, fields: [{ key: 'title', label: 'Étape', type: 'text' }, { key: 'text', label: 'Description', type: 'textarea', rows: 2 }, { key: 'duration', label: 'Durée', type: 'text' }] },
      ],
      defaults: { title: 'Notre process de recrutement', intro: '', items: [{ title: 'Candidature', text: '', duration: '' }, { title: 'Entretien', text: '', duration: '1 h' }, { title: 'Proposition', text: '', duration: '' }] },
      render(p) {
        return '<div class="cs-wrap">' + head(p) + '<ol class="cs-steps">' +
          (p.items || []).map((it, i) => '<li><span class="cs-steps__n">' + (i + 1) + '</span><h3 class="cs-h3">' + e(it.title) + '</h3>' + (it.text ? '<p>' + e(it.text) + '</p>' : '') + (it.duration ? '<span class="cs-chip">' + U.icon('clock') + e(it.duration) + '</span>' : '') + '</li>').join('') +
          '</ol></div>';
      },
    },

    jobs: {
      label: 'Liste des offres', icon: 'briefcase', desc: 'Les offres publiées, avec recherche et filtres',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'intro', label: 'Introduction', type: 'textarea', rows: 2 },
        { key: 'filters', label: 'Afficher la recherche et les filtres', type: 'toggle' },
        { key: 'groupBy', label: 'Regrouper', type: 'select', options: [{ value: 'none', label: 'Ne pas regrouper' }, { value: 'department', label: 'Par équipe' }, { value: 'location', label: 'Par lieu' }] },
        { key: 'limit', label: 'Nombre maximum d’offres (0 = toutes)', type: 'number' },
      ],
      defaults: { title: 'Nos offres', intro: '', filters: true, groupBy: 'none', limit: 0 },
      render(p, ctx) {
        return '<div class="cs-wrap">' + head(p) + CS.site.jobsList(ctx, p) + '</div>';
      },
    },

    teams: {
      label: 'Équipes et métiers', icon: 'users', desc: 'Une carte par équipe, qui mène à ses offres',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'intro', label: 'Introduction', type: 'textarea', rows: 2 },
        { key: 'items', label: 'Équipes', type: 'list', itemLabel: 'name', max: 12, add: { name: 'Nouvelle équipe', icon: 'users', text: '' }, fields: [
          { key: 'name', label: 'Nom de l’équipe', type: 'text', noTr: true, help: 'Écrivez-le comme le champ « Équipe » des offres : la carte affiche et filtre les offres de cette équipe.' },
          { key: 'icon', label: 'Icône', type: 'icon' }, { key: 'text', label: 'Description', type: 'textarea', rows: 2 }] },
      ],
      defaults: { title: 'Nos équipes', intro: '', items: [{ name: 'Tech', icon: 'rocket', text: '' }, { name: 'Sales', icon: 'target', text: '' }] },
      render(p, ctx) {
        const live = CS.site.liveJobs(ctx.data);
        return '<div class="cs-wrap">' + head(p) + '<div class="cs-teams">' +
          (p.items || []).map((it) => {
            const n = live.filter((j) => (j.department || '').toLowerCase() === (it.name || '').toLowerCase()).length;
            return '<a class="cs-team" href="#" data-go="' + (n ? 'dept:' + e(it.name) : 'jobs') + '"><span class="cs-card__icon">' + U.icon(it.icon) + '</span><h3 class="cs-h3">' + e(it.name) + '</h3>' + (it.text ? '<p>' + e(it.text) + '</p>' : '') +
              '<span class="cs-team__count">' + e(CS.t(ctx.lang, 'jobsCount', n)) + (n ? U.icon('arrow') : '') + '</span></a>';
          }).join('') + '</div></div>';
      },
    },

    locations: {
      label: 'Bureaux et localisations', icon: 'pin', desc: 'Vos adresses, avec photo et lien vers la carte',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'intro', label: 'Introduction', type: 'textarea', rows: 2 },
        { key: 'items', label: 'Bureaux', type: 'list', itemLabel: 'city', max: 12, add: { city: 'Ville', address: '', text: '', image: 'ph:5' }, fields: [
          { key: 'city', label: 'Ville', type: 'text', noTr: true, help: 'Écrivez-la comme le champ « Lieu » des offres pour afficher le nombre d’offres.' },
          { key: 'address', label: 'Adresse', type: 'text', noTr: true }, { key: 'text', label: 'Description', type: 'textarea', rows: 2 }, { key: 'image', label: 'Photo', type: 'image' }] },
      ],
      defaults: { title: 'Nos bureaux', intro: '', items: [{ city: 'Paris', address: '', text: '', image: 'ph:5' }] },
      render(p, ctx) {
        const live = CS.site.liveJobs(ctx.data);
        return '<div class="cs-wrap">' + head(p) + '<div class="cs-places">' +
          (p.items || []).map((it) => {
            const n = live.filter((j) => (j.location || '').toLowerCase() === (it.city || '').toLowerCase()).length;
            return '<article class="cs-place">' + img(ctx, it.image, 16 / 10, '', 'cs-place__img') + '<div class="cs-place__body"><h3 class="cs-h3">' + e(it.city) + '</h3>' +
              (it.address ? '<p class="cs-place__addr">' + U.icon('pin') + e(it.address) + '</p>' : '') + (it.text ? '<p>' + e(it.text) + '</p>' : '') +
              '<div class="cs-place__links">' + (n ? '<a href="#" data-go="loc:' + e(it.city) + '">' + e(CS.t(ctx.lang, 'jobsCount', n)) + '</a>' : '') +
              (it.address ? '<a href="https://www.openstreetmap.org/search?query=' + encodeURIComponent(it.address) + '" target="_blank" rel="noopener">' + e(CS.t(ctx.lang, 'seeOnMap')) + U.icon('external') + '</a>' : '') + '</div></div></article>';
          }).join('') + '</div></div>';
      },
    },

    logos: {
      label: 'Logos et labels', icon: 'award', desc: 'Clients, labels, certifications, presse',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'intro', label: 'Introduction', type: 'textarea', rows: 2 },
        { key: 'style', label: 'Affichage des logos', type: 'select', options: [{ value: 'mono', label: 'Monochrome (discret)' }, { value: 'color', label: 'Couleurs d’origine' }] },
        { key: 'items', label: 'Logos', type: 'list', itemLabel: 'name', max: 16, add: { name: 'Nom', image: '' }, fields: [
          { key: 'name', label: 'Nom', type: 'text', noTr: true, help: 'Affiché en texte tant qu’aucun logo n’est importé. Sert aussi de texte alternatif.' },
          { key: 'image', label: 'Logo', type: 'image', optional: true }] },
      ],
      defaults: { title: 'Ils nous font confiance', intro: '', style: 'mono', items: [{ name: 'Client A', image: '' }, { name: 'Client B', image: '' }, { name: 'Client C', image: '' }] },
      render(p) {
        return '<div class="cs-wrap">' + head(p, 'cs-center') + '<ul class="cs-logos cs-logos--' + e(p.style || 'mono') + '">' +
          (p.items || []).map((it) => '<li>' + (it.image && !U.isPlaceholder(it.image) ? '<img src="' + e(it.image) + '" alt="' + e(it.name) + '">' : '<span>' + e(it.name) + '</span>') + '</li>').join('') +
          '</ul></div>';
      },
    },

    faq: {
      label: 'Questions fréquentes', icon: 'chat', desc: 'Questions et réponses dépliables',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'items', label: 'Questions', type: 'list', itemLabel: 'q', max: 20, add: { q: 'Nouvelle question', a: '' }, fields: [{ key: 'q', label: 'Question', type: 'text' }, { key: 'a', label: 'Réponse', type: 'textarea', rows: 3 }] },
      ],
      defaults: { title: 'Questions fréquentes', items: [{ q: 'Comment postuler ?', a: 'Choisissez une offre et remplissez le formulaire.' }] },
      render(p) {
        return '<div class="cs-wrap cs-narrow">' + head(p) + '<div class="cs-faq">' +
          (p.items || []).map((it) => '<details><summary>' + e(it.q) + U.icon('down', 'i cs-faq__chev') + '</summary><p>' + e(it.a) + '</p></details>').join('') +
          '</div></div>';
      },
    },

    cta: {
      label: 'Appel à l’action', icon: 'send', desc: 'Encadré avec un bouton (candidature spontanée…)',
      fields: [
        { key: 'title', label: 'Titre', type: 'text' },
        { key: 'text', label: 'Texte', type: 'textarea', rows: 2 },
        { key: 'buttonLabel', label: 'Bouton', type: 'text' },
        { key: 'action', label: 'Action', type: 'select', options: ACTIONS },
      ],
      defaults: { title: 'Envie de nous rejoindre ?', text: '', buttonLabel: 'Candidature spontanée', action: 'spontaneous' },
      defaultBg: 'primary',
      render(p) {
        return '<div class="cs-wrap cs-cta"><div><h2 class="cs-h2">' + e(p.title) + '</h2>' + (p.text ? '<p class="cs-intro">' + e(p.text) + '</p>' : '') + '</div>' + btn(p.buttonLabel, p.action, 'accent') + '</div>';
      },
    },
  };

  /* Ordre d'affichage dans la bibliothèque de blocs */
  const ORDER = ['hero', 'text', 'textImage', 'stats', 'values', 'benefits', 'teams', 'locations', 'gallery', 'video', 'testimonials', 'logos', 'process', 'jobs', 'faq', 'cta'];

  const BACKGROUNDS = [
    { value: 'default', label: 'Fond de page' },
    { value: 'surface', label: 'Fond doux' },
    { value: 'primary', label: 'Couleur principale' },
    { value: 'accent', label: 'Couleur d’accent' },
  ];

  CS.blocks = { BLOCKS, ORDER, BACKGROUNDS, ACTIONS };
})();

</script>
<script>
/* Moteur du site carrière : transforme les données (thème, pages, blocs, offres, formulaire, traductions) en pages.
   Le même moteur sert l'aperçu de l'éditeur et le site public. */
window.CS = window.CS || {};
CS.config = CS.config || { allowEmbeds: true };

(function () {
  const U = CS.U;
  const e = U.esc;
  const site = {};
  const CONSENT_KEY = 'profilr-cs-consent';

  /* ---------- Thème -> variables CSS ---------- */
  const fontCss = (name) => {
    const f = CS.data.FONTS.find((x) => x.name === name);
    return f ? f.css : "'" + String(name).replace(/'/g, '') + "', system-ui, sans-serif";
  };
  site.fontCss = fontCss;
  const loadedFonts = {};
  site.loadFonts = (theme) => {
    [theme.fonts.heading, theme.fonts.body].forEach((name) => {
      const f = CS.data.FONTS.find((x) => x.name === name);
      if (!f || f.local || loadedFonts[name]) return;
      loadedFonts[name] = true;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name).replace(/%20/g, '+') + ':wght@400;500;600;700&display=swap';
      document.head.appendChild(link);
    });
  };

  site.themeVars = (theme) => {
    const c = theme.colors;
    const radius = { arrondi: ['24px', '16px'], doux: ['14px', '10px'], carre: ['4px', '3px'] }[theme.radius] || ['24px', '16px'];
    const btnRadius = { pilule: '999px', arrondi: '12px', carre: '4px' }[theme.buttons] || '999px';
    const onPrimary = U.onColor(c.primary, c.text, '#FFFFFF');
    const onAccent = U.onColor(c.accent, U.contrast(c.accent, c.primary) > 4.5 ? c.primary : c.text, '#FFFFFF');
    const linkOnBg = U.contrast(c.accent, c.background) >= 3 ? c.accent : c.primary;
    /* Bouton "accent" posé sur un fond clair : s'il se confond avec le fond, on bascule sur la principale */
    const accentVisible = U.contrast(c.accent, c.background) >= 1.6;
    const vars = {
      '--cs-primary': c.primary, '--cs-on-primary': onPrimary, '--cs-accent': c.accent, '--cs-on-accent': onAccent,
      '--cs-text': c.text, '--cs-bg': c.background, '--cs-surface': c.surface, '--cs-link': linkOnBg,
      '--cs-accent-light-bg': accentVisible ? c.accent : c.primary, '--cs-accent-light-on': accentVisible ? onAccent : onPrimary,
      '--cs-muted': U.mix(c.text, c.background, 0.38), '--cs-line': U.mix(c.text, c.background, 0.86), '--cs-primary-soft': U.mix(c.primary, c.background, 0.9),
      '--cs-radius': radius[0], '--cs-radius-sm': radius[1], '--cs-btn-radius': btnRadius,
      '--cs-font-h': fontCss(theme.fonts.heading), '--cs-font-b': fontCss(theme.fonts.body),
    };
    return Object.keys(vars).map((k) => k + ':' + vars[k]).join(';');
  };

  site.logoSrc = (theme, onDark) => {
    if (theme.logo === 'profilr') return U.profilrLogo(onDark ? '#DFFFA5' : theme.colors.primary);
    return theme.logo || '';
  };
  const logoHTML = (theme) => {
    const src = site.logoSrc(theme);
    return src
      ? '<img class="cs-logo" src="' + e(src) + '" alt="' + e(theme.companyName) + '" style="height:' + (Number(theme.logoHeight) || 30) + 'px">'
      : '<span class="cs-wordmark">' + e(theme.companyName || 'Votre entreprise') + '</span>';
  };

  /* ---------- Langues ----------
     Les traductions sont des surcouches : i18n[lang]['b:<bloc>' | 'p:<page>' | 'j:<offre>' | 'form' | 'settings'] = { chemin: texte }.
     Un texte non traduit garde la version de la langue principale. */
  site.defaultLang = (data) => (data.settings.languages || ['fr'])[0];
  site.localize = (data, lang) => {
    if (!lang || lang === site.defaultLang(data)) return data;
    const tr = (data.i18n || {})[lang];
    if (!tr) return data;
    const d = U.clone(data);
    const apply = (obj, map) => obj && map && Object.keys(map).forEach((path) => { if (map[path] !== '' && map[path] != null && !(Array.isArray(map[path]) && !map[path].length)) U.setPath(obj, path, map[path]); });
    Object.keys(tr).forEach((key) => {
      const [kind, id] = key.split(':');
      if (kind === 'b') d.pages.forEach((p) => apply(p.blocks.find((x) => x.id === id), tr[key]));
      else if (kind === 'p') apply(d.pages.find((x) => x.id === id), tr[key]);
      else if (kind === 'j') apply(d.jobs.find((x) => x.id === id), tr[key]);
      else if (key === 'form') apply(d.form, tr[key]);
      else if (key === 'settings') apply(d.settings, tr[key]);
    });
    return d;
  };

  /* ---------- Offres ---------- */
  site.isScheduled = (job) => job.status === 'published' && !!job.publishAt && new Date(job.publishAt) > new Date();
  site.isLive = (job) => job.status === 'published' && !site.isScheduled(job) && (!job.closesAt || new Date(job.closesAt + 'T23:59:59') >= new Date());
  site.liveJobs = (data) => data.jobs.filter(site.isLive);
  site.postedAt = (job) => job.publishedAt || job.publishAt || '';
  const remoteLabel = (id, lang) => { const r = CS.data.REMOTE.find((x) => x.id === id); return r ? CS.t(lang, r.key) : ''; };
  site.salaryLabel = (j, lang) => {
    if (!j.salaryVisible || !j.salaryMin) return '';
    const a = U.fmtK(j.salaryMin), b = U.fmtK(j.salaryMax);
    return (b && j.salaryMax > j.salaryMin ? a.replace(' k', '') + ' – ' + b : a) + CS.t(lang, 'salaryUnit');
  };
  const jobChips = (j, lang, withSalary) => {
    const chips = [
      j.location && [U.icon('pin'), j.location],
      j.contract && [U.icon('briefcase'), j.contract],
      j.remote && [U.icon('home'), remoteLabel(j.remote, lang)],
      withSalary && site.salaryLabel(j, lang) && [U.icon('euro'), site.salaryLabel(j, lang)],
    ].filter(Boolean);
    return chips.map((c) => '<span class="cs-chip">' + c[0] + e(c[1]) + '</span>').join('');
  };
  const jobCard = (j, lang) =>
    '<a class="cs-job" href="#" data-go="job:' + e(j.id) + '" data-q="' + e((j.title + ' ' + j.department + ' ' + j.summary + ' ' + U.mdText(j.description)).toLowerCase()) + '" data-department="' + e(j.department) + '" data-location="' + e(j.location) + '" data-contract="' + e(j.contract) + '" data-remote="' + e(j.remote) + '">' +
    '<div class="cs-job__main"><span class="cs-job__dept">' + e(j.department) + '</span><h3 class="cs-job__title">' + e(j.title) + '</h3><div class="cs-chips">' + jobChips(j, lang, false) + '</div></div>' +
    '<span class="cs-job__go">' + U.icon('arrow') + '</span></a>';

  site.jobsList = (ctx, p) => {
    const L = ctx.lang;
    let jobs = site.liveJobs(ctx.data).slice().sort((a, b) => String(site.postedAt(b)).localeCompare(String(site.postedAt(a))));
    const limit = Number(p.limit) || 0;
    if (limit) jobs = jobs.slice(0, limit);
    if (!jobs.length)
      return '<div class="cs-empty">' + U.icon('briefcase') + '<p><strong>' + e(CS.t(L, 'noJobs')) + '</strong><br>' + e(CS.t(L, 'noJobsSub')) + '</p>' +
        '<a class="cs-btn cs-btn--main" href="#" data-go="spontaneous">' + e(CS.t(L, 'spontaneous')) + '</a></div>';
    const uniq = (k) => Array.from(new Set(jobs.map((j) => j[k]).filter(Boolean))).sort();
    const sel = (k, label, opts) =>
      opts.length > 1
        ? '<label class="cs-field cs-field--inline"><span class="cs-sr">' + e(label) + '</span><select data-filter="' + k + '"><option value="">' + e(label) + '</option>' + opts.map((o) => '<option value="' + e(o.value || o) + '">' + e(o.label || o) + '</option>').join('') + '</select></label>'
        : '';
    const filters = p.filters
      ? '<div class="cs-filters" role="search"><label class="cs-search">' + U.icon('search') + '<span class="cs-sr">' + e(CS.t(L, 'searchLabel')) + '</span><input type="search" data-filter="q" placeholder="' + e(CS.t(L, 'searchPh')) + '"></label>' +
        sel('department', CS.t(L, 'allTeams'), uniq('department')) +
        sel('location', CS.t(L, 'allLocations'), uniq('location')) +
        sel('contract', CS.t(L, 'allContracts'), uniq('contract')) +
        sel('remote', CS.t(L, 'remote'), uniq('remote').map((r) => ({ value: r, label: remoteLabel(r, L) }))) +
        '</div>'
      : '';
    let list;
    if (p.groupBy && p.groupBy !== 'none') {
      const groups = {};
      jobs.forEach((j) => { const k = j[p.groupBy] || '—'; (groups[k] = groups[k] || []).push(j); });
      list = Object.keys(groups).sort().map((k) => '<div class="cs-jobgroup" data-group><h3 class="cs-jobgroup__title">' + e(k) + ' <span>' + groups[k].length + '</span></h3><div class="cs-jobs">' + groups[k].map((j) => jobCard(j, L)).join('') + '</div></div>').join('');
    } else list = '<div class="cs-jobs">' + jobs.map((j) => jobCard(j, L)).join('') + '</div>';
    return '<div data-jobs data-lang="' + e(L) + '">' + filters + '<p class="cs-count" aria-live="polite" data-count>' + e(CS.t(L, 'openJobs', jobs.length)) + '</p>' + list +
      '<div class="cs-empty" data-noresult hidden>' + U.icon('search') + '<p><strong>' + e(CS.t(L, 'noMatch')) + '</strong><br>' + e(CS.t(L, 'noMatchSub')) + '</p></div></div>';
  };

  const filterJobs = (box) => {
    const vals = {};
    box.querySelectorAll('[data-filter]').forEach((el) => (vals[el.dataset.filter] = el.value.trim().toLowerCase()));
    let n = 0;
    box.querySelectorAll('.cs-job').forEach((card) => {
      const ok = (!vals.q || card.dataset.q.indexOf(vals.q) >= 0) &&
        ['department', 'location', 'contract', 'remote'].every((k) => !vals[k] || card.dataset[k].toLowerCase() === vals[k]);
      card.hidden = !ok;
      if (ok) n++;
    });
    box.querySelectorAll('[data-group]').forEach((g) => (g.hidden = !g.querySelector('.cs-job:not([hidden])')));
    const c = box.querySelector('[data-count]');
    const any = Object.keys(vals).some((k) => vals[k]);
    if (c) c.textContent = CS.t(box.dataset.lang, any ? 'matchJobs' : 'openJobs', n);
    const nr = box.querySelector('[data-noresult]');
    if (nr) nr.hidden = n > 0;
  };

  /* Données structurées schema.org JobPosting, lues par Google for Jobs */
  site.jobPostingLD = (job, data) => {
    const t = data.theme, s = data.settings;
    const ld = {
      '@context': 'https://schema.org/', '@type': 'JobPosting',
      title: job.title, description: U.md(job.description),
      datePosted: (site.postedAt(job) || new Date().toISOString()).slice(0, 10),
      employmentType: { CDI: 'FULL_TIME', CDD: 'TEMPORARY', Stage: 'INTERN', Alternance: 'INTERN', Freelance: 'CONTRACTOR' }[job.contract] || 'FULL_TIME',
      hiringOrganization: { '@type': 'Organization', name: t.companyName, sameAs: site.publicUrl(s) },
      jobLocation: { '@type': 'Place', address: { '@type': 'PostalAddress', addressLocality: job.location, addressCountry: 'FR' } },
      directApply: true,
    };
    if (job.closesAt) ld.validThrough = job.closesAt + 'T23:59:59';
    if (job.remote === 'remote') { ld.jobLocationType = 'TELECOMMUTE'; ld.applicantLocationRequirements = { '@type': 'Country', name: 'France' }; }
    if (job.salaryMin) ld.baseSalary = { '@type': 'MonetaryAmount', currency: 'EUR', value: { '@type': 'QuantitativeValue', minValue: job.salaryMin, maxValue: job.salaryMax || job.salaryMin, unitText: 'YEAR' } };
    return ld;
  };
  site.publicUrl = (s) => 'https://' + (s.customDomain || (s.slug || 'entreprise') + '.jobs.profilr.eu');
  site.jobUrl = (s, job, lang) => site.publicUrl(s) + (lang && lang !== (s.languages || ['fr'])[0] ? '/' + lang : '') + '/offres/' + job.id;

  /* ---------- Formulaire de candidature ---------- */
  const field = (L, id, label, input, req, hint) =>
    '<div class="cs-field"><label for="' + id + '">' + e(label) + (req ? ' <span class="cs-req" aria-hidden="true">*</span>' : ' <span class="cs-opt">' + e(CS.t(L, 'optional')) + '</span>') + '</label>' + input +
    (hint ? '<p class="cs-hint">' + e(hint) + '</p>' : '') + '<p class="cs-error" data-error-for="' + id + '" hidden></p></div>';

  /* Réglages effectifs du formulaire pour une offre (le fichier complémentaire peut être réglé par offre) */
  site.formFor = (data, job) => {
    const f = data.form;
    const fields = Object.assign({}, f.fields);
    let extraLabel = f.extraFileLabel;
    if (job && job.extraFile && job.extraFile !== 'default') fields.extraFile = job.extraFile;
    if (job && job.extraFileLabel && fields.extraFile !== 'off') extraLabel = job.extraFileLabel;
    return { fields, extraLabel };
  };
  const FILE_RULES = {
    cv: { accept: '.pdf,.doc,.docx,.odt', max: 10, hint: 'fileHint' },
    coverLetterFile: { accept: '.pdf,.doc,.docx,.odt', max: 10, hint: 'fileHint' },
    extraFile: { accept: '.pdf,.png,.jpg,.jpeg,.zip,.key,.ppt,.pptx', max: 20, hint: 'extraHint' },
  };

  site.applyForm = (ctx, job) => {
    const L = ctx.lang;
    const f = ctx.data.form;
    const { fields, extraLabel } = site.formFor(ctx.data, job);
    const pre = ctx.idPrefix || 'ap';
    const id = (k) => pre + '-' + k;
    const st = (k) => fields[k] || 'off';
    const inp = (k, type, auto, req) => '<input id="' + id(k) + '" name="' + k + '" type="' + type + '" autocomplete="' + auto + '"' + (req ? ' required' : '') + '>';
    const fileInput = (k, label) =>
      st(k) === 'off' ? '' : field(L, id(k), label,
        '<label class="cs-file" for="' + id(k) + '">' + U.icon(k === 'extraFile' ? 'paperclip' : 'upload') + '<span data-file-label>' + CS.t(L, 'dropFile') + '</span><input id="' + id(k) + '" name="' + k + '" type="file" accept="' + FILE_RULES[k].accept + '"' + (st(k) === 'required' ? ' required' : '') + '></label>',
        st(k) === 'required', CS.t(L, FILE_RULES[k].hint));
    let h = '<form class="cs-form" data-apply="' + e(job ? job.id : '') + '" novalidate>';
    h += '<div class="cs-form__row">' + field(L, id('firstName'), CS.t(L, 'firstName'), inp('firstName', 'text', 'given-name', true), true) + field(L, id('lastName'), CS.t(L, 'lastName'), inp('lastName', 'text', 'family-name', true), true) + '</div>';
    h += '<div class="cs-form__row">' + field(L, id('email'), CS.t(L, 'email'), inp('email', 'email', 'email', true), true) +
      (st('phone') !== 'off' ? field(L, id('phone'), CS.t(L, 'phone'), inp('phone', 'tel', 'tel', st('phone') === 'required'), st('phone') === 'required') : '') + '</div>';
    if (st('linkedin') !== 'off') h += field(L, id('linkedin'), CS.t(L, 'linkedin'), '<input id="' + id('linkedin') + '" name="linkedin" type="url" placeholder="https://www.linkedin.com/in/…"' + (st('linkedin') === 'required' ? ' required' : '') + '>', st('linkedin') === 'required');
    h += fileInput('cv', CS.t(L, 'cv'));
    h += fileInput('coverLetterFile', CS.t(L, 'coverLetterFile'));
    h += fileInput('extraFile', extraLabel || 'Fichier complémentaire');
    if (st('coverLetter') !== 'off') h += field(L, id('coverLetter'), CS.t(L, 'coverLetter'), '<textarea id="' + id('coverLetter') + '" name="coverLetter" rows="5"' + (st('coverLetter') === 'required' ? ' required' : '') + '></textarea>', st('coverLetter') === 'required');
    (f.questions || []).forEach((q) => {
      const qid = id(q.id);
      let input;
      if (q.type === 'textarea') input = '<textarea id="' + qid + '" name="' + e(q.id) + '" rows="3"' + (q.required ? ' required' : '') + '></textarea>';
      else if (q.type === 'select') input = '<select id="' + qid + '" name="' + e(q.id) + '"' + (q.required ? ' required' : '') + '><option value="">' + e(CS.t(L, 'choose')) + '</option>' + (q.options || []).map((o, i) => '<option value="' + i + '">' + e(o) + '</option>').join('') + '</select>';
      else if (q.type === 'yesno') input = '<div class="cs-radios" role="radiogroup" id="' + qid + '">' + [['Oui', 'yes'], ['Non', 'no']].map((o, i) => '<label><input type="radio" name="' + e(q.id) + '" value="' + o[0] + '"' + (q.required && !i ? ' required' : '') + '> ' + e(CS.t(L, o[1])) + '</label>').join('') + '</div>';
      else input = '<input id="' + qid + '" name="' + e(q.id) + '" type="text"' + (q.required ? ' required' : '') + '>';
      h += field(L, qid, q.label, input, q.required);
    });
    const privacy = ctx.data.settings.privacyUrl ? ' <a href="' + e(ctx.data.settings.privacyUrl) + '" target="_blank" rel="noopener">' + e(CS.t(L, 'privacy')) + '</a>' : '';
    h += '<div class="cs-field cs-check"><label><input type="checkbox" name="consent" id="' + id('consent') + '" required> <span>' + e(f.consent) + privacy + '</span></label><p class="cs-error" data-error-for="' + id('consent') + '" hidden></p></div>';
    if (f.talentPoolOptIn) h += '<div class="cs-field cs-check"><label><input type="checkbox" name="talentPool" id="' + id('talentPool') + '" checked> <span>' + e(CS.t(L, 'talentPool')) + '</span></label></div>';
    h += '<div class="cs-form__submit"><button type="submit" class="cs-btn cs-btn--main">' + e(CS.t(L, job ? 'send' : 'sendSpontaneous')) + '</button><p class="cs-hint">' + e(CS.t(L, 'requiredNote')) + '</p></div>';
    return h + '</form>';
  };

  const showError = (form, inputId, msg) => {
    const p = form.querySelector('[data-error-for="' + inputId + '"]');
    if (p) { p.textContent = msg; p.hidden = !msg; }
    const el = form.querySelector('#' + CSS.escape(inputId));
    if (el) el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  };

  const submitApply = (form, ctl) => {
    const L = ctl.lang;
    const raw = ctl.getData();
    const data = site.localize(raw, L);
    const jobId = form.dataset.apply || null;
    const job = jobId ? raw.jobs.find((j) => j.id === jobId) : null;
    const { fields, extraLabel } = site.formFor(data, job);
    const fd = (name) => {
      const el = form.elements[name];
      if (!el) return '';
      if (el instanceof RadioNodeList) return el.value || '';
      return el.type === 'checkbox' ? el.checked : (el.value || '').trim();
    };
    const pre = form.querySelector('input').id.split('-')[0];
    const id = (k) => pre + '-' + k;
    let firstBad = null;
    const check = (k, ok, msg) => {
      showError(form, id(k), ok ? '' : msg);
      if (!ok && !firstBad) firstBad = form.querySelector('#' + CSS.escape(id(k)));
    };
    check('firstName', fd('firstName'), CS.t(L, 'errFirst'));
    check('lastName', fd('lastName'), CS.t(L, 'errLast'));
    check('email', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(fd('email')), CS.t(L, 'errEmail'));
    if (fields.phone === 'required') check('phone', fd('phone').replace(/\D/g, '').length >= 9, CS.t(L, 'errPhone'));
    if (fields.linkedin === 'required') check('linkedin', fd('linkedin'), CS.t(L, 'errLinkedin'));
    const files = {};
    Object.keys(FILE_RULES).forEach((k) => {
      const el = form.elements[k];
      if (!el) return;
      const file = el.files && el.files[0];
      if (file && file.size > FILE_RULES[k].max * 1024 * 1024) check(k, false, CS.t(L, 'errSize', FILE_RULES[k].max));
      else check(k, fields[k] !== 'required' || file, CS.t(L, 'errFile'));
      if (file) files[k] = { name: file.name, size: file.size };
    });
    if (fields.coverLetter === 'required') check('coverLetter', fd('coverLetter'), CS.t(L, 'errLetter'));
    /* Les réponses sont enregistrées dans la langue principale, pour que l'équipe les lise toutes pareil */
    const answers = {};
    let knockedOut = false;
    (raw.form.questions || []).forEach((q) => {
      let v = fd(q.id);
      if (q.type === 'select' && v !== '') v = (q.options || [])[+v] || v;
      answers[q.id] = v;
      if (q.required) check(q.id, v, CS.t(L, 'errRequired'));
      if (q.knockout && v && v === q.knockout) knockedOut = true;
    });
    check('consent', fd('consent'), CS.t(L, 'errConsent'));
    if (firstBad) { firstBad.focus(); return; }
    /* libellé enregistré dans la langue principale, pour l'équipe */
    if (files.extraFile) files.extraFile.label = site.formFor(raw, job).extraLabel || extraLabel;
    const app = {
      id: U.uid('a_'), jobId: job ? job.id : null, createdAt: new Date().toISOString(), status: 'Nouveau',
      source: ctl.mode === 'editor' ? 'Aperçu de l’éditeur' : (ctl.source || 'Accès direct'), lang: L,
      firstName: fd('firstName'), lastName: fd('lastName'), email: fd('email'), phone: fd('phone'), linkedin: fd('linkedin'), coverLetter: fd('coverLetter'),
      cv: files.cv || null, files: { coverLetterFile: files.coverLetterFile, extraFile: files.extraFile }, answers, knockedOut, talentPool: !!fd('talentPool'),
      projectId: job ? job.projectId : 'p-199',
    };
    ctl.onApply && ctl.onApply(app);
    ctl.go({ name: 'done', id: app.jobId });
  };

  /* ---------- Morceaux de page ---------- */
  site.pageOf = (data, route) => (route && route.name === 'page' && data.pages.find((p) => p.id === route.id)) || data.pages[0];
  const jobsBlockPage = (data) => data.pages.find((p) => p.blocks.some((b) => b.type === 'jobs' && !b.hidden));

  const header = (ctx, route) => {
    const L = ctx.lang, d = ctx.data;
    const current = route.name === 'page' || route.name === 'home' ? site.pageOf(d, route) : null;
    const links = d.pages.slice(1).filter((p) => p.inMenu).map((p) => ({ go: 'page:' + p.id, label: p.title, on: current && current.id === p.id }))
      .concat(current ? current.blocks.filter((b) => !b.hidden && b.menu).map((b) => ({ go: 'sec:' + b.id, label: b.menu })) : []);
    if (d.pages.length > 1 && !(current && current === d.pages[0])) links.unshift({ go: 'home', label: CS.t(L, 'home') });
    const langs = d.settings.languages || ['fr'];
    const switcher = langs.length > 1
      ? '<div class="cs-langs" role="group" aria-label="' + e(CS.t(L, 'language')) + '">' + langs.map((l) => { const def = CS.LANGS.find((x) => x.id === l) || { short: l.toUpperCase(), label: l }; return '<button type="button" data-lang="' + l + '" lang="' + l + '" title="' + e(def.label) + '"' + (l === L ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' + e(def.short) + '</button>'; }).join('') + '</div>'
      : '';
    const linkHTML = links.map((x) => '<a href="#" data-go="' + e(x.go) + '"' + (x.on ? ' aria-current="page"' : '') + '>' + e(x.label) + '</a>').join('');
    return '<header class="cs-header"><div class="cs-wrap cs-header__in"><a href="#" class="cs-header__logo" data-go="home" aria-label="' + e(CS.t(L, 'home') + ' – ' + d.theme.companyName) + '">' + logoHTML(d.theme) + '</a>' +
      '<nav class="cs-nav" aria-label="' + e(CS.t(L, 'mainNav')) + '">' + linkHTML + '</nav>' + switcher +
      '<a class="cs-btn cs-btn--main cs-btn--sm cs-header__cta" href="#" data-go="jobs">' + e(CS.t(L, 'seeJobs')) + '</a>' +
      (links.length ? '<details class="cs-burger"><summary aria-label="' + e(CS.t(L, 'menu')) + '">' + U.icon('menu') + '</summary><nav class="cs-burger__panel" aria-label="' + e(CS.t(L, 'mainNav')) + '">' + linkHTML + (links.some((x) => x.go.indexOf('sec:') === 0 && current && current.blocks.some((b) => b.id === x.go.slice(4) && b.type === 'jobs')) ? '' : '<a href="#" data-go="jobs">' + e(CS.t(L, 'seeJobs')) + '</a>') + '</nav></details>' : '') +
      '</div></header>';
  };
  const footer = (ctx) => {
    const L = ctx.lang, s = ctx.data.settings, t = ctx.data.theme;
    return '<footer class="cs-footer"><div class="cs-wrap cs-footer__in"><div>' + logoHTML(t) + '<p>© ' + new Date().getFullYear() + ' ' + e(t.companyName) + '</p></div>' +
      '<nav aria-label="' + e(CS.t(L, 'legalNav')) + '"><a href="#" data-go="jobs">' + e(CS.t(L, 'jobsTitle')) + '</a><a href="#" data-go="spontaneous">' + e(CS.t(L, 'spontaneous')) + '</a>' +
      (s.privacyUrl ? '<a href="' + e(s.privacyUrl) + '" target="_blank" rel="noopener">' + e(CS.t(L, 'privacy')) + '</a>' : '') +
      (s.legalUrl ? '<a href="' + e(s.legalUrl) + '" target="_blank" rel="noopener">' + e(CS.t(L, 'rights')) + '</a>' : '') +
      (s.analytics ? '<a href="#" data-cookies="open">' + e(CS.t(L, 'cookies')) + '</a>' : '') + '</nav>' +
      (s.showPoweredBy ? '<p class="cs-powered">' + e(CS.t(L, 'poweredBy')) + ' <strong>Profilr</strong></p>' : '') + '</div></footer>';
  };

  const sectionHTML = (b, ctx) => {
    const def = CS.blocks.BLOCKS[b.type];
    if (!def) return '';
    let inner;
    try { inner = def.render(b.props || {}, ctx); } catch (err) { inner = '<div class="cs-wrap"><p class="cs-empty">Ce bloc n’a pas pu s’afficher.</p></div>'; console.error(err); }
    const editor = ctx.mode === 'editor';
    return '<section class="cs-sec cs-sec--' + b.type + ' cs-bg-' + (b.bg || 'default') + (editor && ctx.selectedId === b.id ? ' is-selected' : '') + '" id="sec-' + e(b.id) + '" data-block="' + e(b.id) + '"' +
      (editor ? ' data-label="' + e(def.label) + '"' : '') + '>' + inner + '</section>';
  };

  const blocksPage = (ctx, page) => page.blocks.filter((b) => !b.hidden).map((b) => sectionHTML(b, ctx)).join('') ||
    '<section class="cs-sec"><div class="cs-wrap cs-empty"><p><strong>' + e(CS.t(ctx.lang, 'emptyPage')) + '</strong>' + (ctx.mode === 'editor' ? '<br>' + e(CS.t(ctx.lang, 'emptyPageSub')) : '') + '</p></div></section>';

  const jobsPage = (ctx) => '<section class="cs-sec"><div class="cs-wrap"><h1 class="cs-h1 cs-h1--page">' + e(CS.t(ctx.lang, 'jobsTitle')) + '</h1>' + site.jobsList(ctx, { filters: true, groupBy: 'none' }) + '</div></section>';

  const jobPage = (ctx, job) => {
    const L = ctx.lang;
    if (!job || (ctx.mode !== 'editor' && !site.isLive(job)))
      return '<section class="cs-sec"><div class="cs-wrap cs-empty"><p><strong>' + e(CS.t(L, 'jobGone')) + '</strong></p><a class="cs-btn cs-btn--main" href="#" data-go="jobs">' + e(CS.t(L, 'seeOpenJobs')) + '</a></div></section>';
    let state = '';
    if (job.status === 'draft') state = CS.t(L, 'stDraft');
    else if (job.status === 'archived') state = CS.t(L, 'stArchived');
    else if (site.isScheduled(job)) state = CS.t(L, 'stScheduled', U.fmtDate(job.publishAt, L) + ' ' + new Date(job.publishAt).toLocaleTimeString(U.locale(L), { hour: '2-digit', minute: '2-digit' }));
    else if (!site.isLive(job)) state = CS.t(L, 'stExpired');
    const draftNote = state ? '<p class="cs-draftnote">' + U.icon('eyeOff') + e(CS.t(L, 'previewHidden', state)) + '</p>' : '';
    const facts = [
      [CS.t(L, 'team'), job.department], [CS.t(L, 'location'), job.location], [CS.t(L, 'contract'), job.contract], [CS.t(L, 'remote'), remoteLabel(job.remote, L)],
      [CS.t(L, 'experience'), job.experience], [CS.t(L, 'salary'), site.salaryLabel(job, L)], [CS.t(L, 'posted'), site.postedAt(job) && !site.isScheduled(job) ? U.relDays(site.postedAt(job), L) : ''],
    ].filter((x) => x[1]);
    const url = site.jobUrl(ctx.data.settings, job, L);
    const similar = site.liveJobs(ctx.data).filter((j) => j.id !== job.id).sort((a, b) => (b.department === job.department) - (a.department === job.department)).slice(0, 3);
    return draftNote +
      '<section class="cs-sec cs-bg-surface cs-jobhead"><div class="cs-wrap"><a href="#" class="cs-back" data-go="jobs">' + U.icon('back') + e(CS.t(L, 'allJobs')) + '</a>' +
      '<p class="cs-eyebrow">' + e(job.department) + '</p><h1 class="cs-h1">' + e(job.title) + '</h1>' + (job.summary ? '<p class="cs-lead">' + e(job.summary) + '</p>' : '') +
      '<div class="cs-chips">' + jobChips(job, L, true) + '</div></div></section>' +
      '<section class="cs-sec"><div class="cs-wrap cs-jobbody"><article class="cs-prose">' + U.md(job.description) + '</article>' +
      '<aside class="cs-jobaside"><dl>' + facts.map((f) => '<div><dt>' + e(f[0]) + '</dt><dd>' + e(f[1]) + '</dd></div>').join('') + '</dl>' +
      '<a class="cs-btn cs-btn--main cs-btn--block" href="#" data-go="sec:postuler">' + e(CS.t(L, 'apply')) + '</a>' +
      '<div class="cs-share"><a class="cs-btn cs-btn--ghost" href="https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(url) + '" target="_blank" rel="noopener">' + U.icon('external') + e(CS.t(L, 'shareLinkedIn')) + '</a>' +
      '<button type="button" class="cs-btn cs-btn--ghost" data-copy="' + e(url) + '" data-copied="' + e(CS.t(L, 'linkCopied')) + '">' + U.icon('link') + '<span>' + e(CS.t(L, 'copyLink')) + '</span></button></div></aside></div></section>' +
      '<section class="cs-sec cs-bg-surface" id="sec-postuler"><div class="cs-wrap cs-narrow"><h2 class="cs-h2">' + e(CS.t(L, 'apply')) + '</h2><p class="cs-intro">' + e(job.title) + ' · ' + e(job.location) + '</p>' + site.applyForm(ctx, job) + '</div></section>' +
      (similar.length ? '<section class="cs-sec"><div class="cs-wrap"><h2 class="cs-h2">' + e(CS.t(L, 'similar')) + '</h2><div class="cs-jobs">' + similar.map((j) => jobCard(j, L)).join('') + '</div></div></section>' : '');
  };

  const spontaneousPage = (ctx) =>
    '<section class="cs-sec cs-bg-surface cs-jobhead"><div class="cs-wrap cs-narrow"><a href="#" class="cs-back" data-go="home">' + U.icon('back') + e(CS.t(ctx.lang, 'back')) + '</a><p class="cs-eyebrow">' + e(CS.t(ctx.lang, 'spontaneous')) + '</p>' +
    '<h1 class="cs-h1">' + e(CS.t(ctx.lang, 'spontTitle')) + '</h1><p class="cs-lead">' + e(CS.t(ctx.lang, 'spontLead')) + '</p></div></section>' +
    '<section class="cs-sec"><div class="cs-wrap cs-narrow">' + site.applyForm(ctx, null) + '</div></section>';

  const donePage = (ctx, route) => {
    const f = ctx.data.form;
    const job = route.id ? ctx.data.jobs.find((j) => j.id === route.id) : null;
    return '<section class="cs-sec"><div class="cs-wrap cs-narrow cs-done"><span class="cs-done__icon">' + U.icon('check') + '</span>' +
      '<h1 class="cs-h1 cs-h1--page">' + e(f.confirmTitle) + '</h1>' + (job ? '<p class="cs-eyebrow">' + e(job.title) + '</p>' : '') + '<p class="cs-lead">' + e(f.confirmText) + '</p>' +
      '<div class="cs-actions cs-actions--center"><a class="cs-btn cs-btn--main" href="#" data-go="jobs">' + e(CS.t(ctx.lang, 'seeOtherJobs')) + '</a><a class="cs-btn cs-btn--ghost" href="#" data-go="home">' + e(CS.t(ctx.lang, 'backHome')) + '</a></div></div></section>';
  };

  /* ---------- Consentement et mesure d'audience ---------- */
  site.getConsent = () => { try { return localStorage.getItem(CONSENT_KEY); } catch (err) { return null; } };
  site.setConsent = (v) => { try { localStorage.setItem(CONSENT_KEY, v); } catch (err) { /* navigation privée */ } };
  const cookieBanner = (ctx) =>
    '<div class="cs-cookie" role="dialog" aria-live="polite" aria-label="' + e(CS.t(ctx.lang, 'cookieTitle')) + '"><div><strong>' + e(CS.t(ctx.lang, 'cookieTitle')) + '</strong><p>' + e(ctx.data.settings.cookieText) +
    (ctx.data.settings.privacyUrl ? ' <a href="' + e(ctx.data.settings.privacyUrl) + '" target="_blank" rel="noopener">' + e(CS.t(ctx.lang, 'privacy')) + '</a>' : '') + '</p></div>' +
    '<div class="cs-cookie__btns"><button type="button" class="cs-btn cs-btn--ghost cs-btn--sm" data-cookies="no">' + e(CS.t(ctx.lang, 'refuse')) + '</button><button type="button" class="cs-btn cs-btn--main cs-btn--sm" data-cookies="yes">' + e(CS.t(ctx.lang, 'accept')) + '</button></div></div>';

  /* ---------- Rendu complet ---------- */
  site.render = (ctl) => {
    const raw = ctl.getData();
    const langs = raw.settings.languages || ['fr'];
    if (!ctl.lang || langs.indexOf(ctl.lang) < 0) ctl.lang = langs[0];
    const data = site.localize(raw, ctl.lang);
    const route = ctl.route || { name: 'home' };
    const ctx = { data, theme: data.theme, mode: ctl.mode, lang: ctl.lang, selectedId: ctl.selectedId, idPrefix: ctl.mode === 'editor' ? 'pv' : 'ap' };
    site.loadFonts(data.theme);
    let main;
    if (route.name === 'job') main = jobPage(ctx, data.jobs.find((j) => j.id === route.id));
    else if (route.name === 'spontaneous') main = spontaneousPage(ctx);
    else if (route.name === 'done') main = donePage(ctx, route);
    else if (route.name === 'jobs' && !jobsBlockPage(data)) main = jobsPage(ctx);
    else main = blocksPage(ctx, site.pageOf(data, route));
    const root = ctl.root;
    root.setAttribute('style', site.themeVars(data.theme));
    root.setAttribute('lang', ctl.lang);
    root.classList.add('cs-root');
    root.classList.toggle('cs-root--editor', ctl.mode === 'editor');
    const showBanner = ctl.mode !== 'editor' && data.settings.analytics && (ctl.forceBanner || !site.getConsent());
    root.innerHTML = header(ctx, route) + '<main class="cs-main">' + main + '</main>' + footer(ctx) + (showBanner ? cookieBanner(ctx) : '');
    site.bind(ctl);
    if (ctl.mode !== 'editor') {
      let ld = document.getElementById('cs-jobposting');
      const job = route.name === 'job' && data.jobs.find((j) => j.id === route.id && site.isLive(j));
      if (job) {
        if (!ld) { ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'cs-jobposting'; document.head.appendChild(ld); }
        ld.textContent = JSON.stringify(site.jobPostingLD(job, data));
      } else if (ld) ld.remove();
      document.title = job ? job.title + ' – ' + data.theme.companyName : (route.name === 'page' ? site.pageOf(data, route).title + ' – ' : '') + data.settings.siteTitle;
      /* mesure d'audience, seulement avec le consentement du visiteur */
      if (ctl.track && data.settings.analytics && site.getConsent() === 'yes') {
        ctl.track('pageViews');
        if (job) ctl.track('jobViews', job.id);
      }
    }
  };

  /* Navigation interne : data-go="home | jobs | spontaneous | job:<id> | page:<id> | sec:<id> | dept:<équipe> | loc:<ville>" */
  site.bind = (ctl) => {
    const root = ctl.root;
    if (root._csBound) return;
    root._csBound = true;
    const scrollToJobs = (filterKey, filterVal) => {
      const d = ctl.getData();
      const pg = jobsBlockPage(d);
      const run = () => {
        const box = root.querySelector('[data-jobs]');
        if (!box) return;
        if (filterKey) {
          const sel = box.querySelector('[data-filter="' + filterKey + '"]');
          if (sel) { const opt = Array.from(sel.options).find((o) => o.value.toLowerCase() === filterVal); sel.value = opt ? opt.value : ''; filterJobs(box); }
        }
        box.closest('section').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      if (!pg) return ctl.go({ name: 'jobs' }, filterKey ? run : null);
      const cur = ctl.route || { name: 'home' };
      const onPage = (cur.name === 'home' && pg === d.pages[0]) || (cur.name === 'page' && cur.id === pg.id);
      if (onPage) run();
      else ctl.go(pg === d.pages[0] ? { name: 'home' } : { name: 'page', id: pg.id }, run);
    };
    root.addEventListener('click', (ev) => {
      const burger = root.querySelector('.cs-burger[open]');
      if (burger && !ev.target.closest('.cs-burger summary')) burger.open = false;
      const embed = ev.target.closest('[data-embed]');
      if (embed) {
        const fr = document.createElement('iframe');
        fr.src = embed.dataset.embed + '?autoplay=1';
        fr.allow = 'autoplay; fullscreen; picture-in-picture';
        fr.allowFullscreen = true;
        fr.title = 'Vidéo';
        fr.className = 'cs-video__el';
        embed.replaceWith(fr);
        return;
      }
      const lang = ev.target.closest('[data-lang]');
      if (lang && root.contains(lang) && lang.tagName === 'BUTTON') { ctl.setLang ? ctl.setLang(lang.dataset.lang) : (ctl.lang = lang.dataset.lang, site.render(ctl)); return; }
      const ck = ev.target.closest('[data-cookies]');
      if (ck) {
        ev.preventDefault();
        if (ck.dataset.cookies === 'open') { ctl.forceBanner = true; site.render(ctl); return; }
        const prev = site.getConsent();
        site.setConsent(ck.dataset.cookies);
        ctl.forceBanner = false;
        if (ctl.track && prev !== ck.dataset.cookies) {
          ctl.track(ck.dataset.cookies === 'yes' ? 'consentYes' : 'consentNo');
          if (ck.dataset.cookies === 'yes' && !prev) ctl.onConsent && ctl.onConsent();
        }
        const banner = root.querySelector('.cs-cookie');
        if (banner) banner.remove();
        return;
      }
      const copy = ev.target.closest('[data-copy]');
      if (copy) {
        const lab = copy.querySelector('span');
        const old = lab.textContent;
        const done = () => { lab.textContent = copy.dataset.copied; setTimeout(() => { lab.textContent = old; }, 1800); };
        try { navigator.clipboard.writeText(copy.dataset.copy).then(done, () => CS.toast && CS.toast(copy.dataset.copy)); } catch (err) { CS.toast && CS.toast(copy.dataset.copy); }
        return;
      }
      const go = ev.target.closest('[data-go]');
      if (go) {
        ev.preventDefault();
        ev.stopPropagation();
        const v = go.dataset.go;
        if (v.indexOf('sec:') === 0) {
          const target = root.querySelector('#sec-' + CSS.escape(v.slice(4)));
          if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
          const d = ctl.getData();
          const pg = d.pages.find((p) => p.blocks.some((b) => b.id === v.slice(4)));
          ctl.go(!pg || pg === d.pages[0] ? { name: 'home' } : { name: 'page', id: pg.id }, () => { const t = root.querySelector('#sec-' + CSS.escape(v.slice(4))); t && t.scrollIntoView({ block: 'start' }); });
          return;
        }
        if (v === 'jobs') return scrollToJobs();
        if (v.indexOf('dept:') === 0) return scrollToJobs('department', v.slice(5).toLowerCase());
        if (v.indexOf('loc:') === 0) return scrollToJobs('location', v.slice(4).toLowerCase());
        if (v === 'home') return ctl.go({ name: 'home' });
        if (v === 'spontaneous') return ctl.go({ name: 'spontaneous' });
        if (v.indexOf('page:') === 0) return ctl.go({ name: 'page', id: v.slice(5) });
        if (v.indexOf('job:') === 0) return ctl.go({ name: 'job', id: v.slice(4) });
        return;
      }
      if (ctl.mode === 'editor' && ctl.onSelectBlock) {
        const sec = ev.target.closest('[data-block]');
        if (sec && !ev.target.closest('input,select,textarea,label,summary,button,a')) ctl.onSelectBlock(sec.dataset.block);
      }
    });
    root.addEventListener('input', (ev) => {
      const box = ev.target.closest('[data-jobs]');
      if (box && ev.target.dataset.filter) filterJobs(box);
    });
    root.addEventListener('focusin', (ev) => {
      const form = ev.target.closest('form[data-apply]');
      if (form && !form._started) {
        form._started = true;
        if (ctl.track && ctl.mode !== 'editor' && site.getConsent() === 'yes' && ctl.getData().settings.analytics) ctl.track('applyStarts');
      }
    });
    root.addEventListener('change', (ev) => {
      const box = ev.target.closest('[data-jobs]');
      if (box && ev.target.dataset.filter) filterJobs(box);
      if (ev.target.type === 'file') {
        const label = ev.target.parentNode.querySelector('[data-file-label]');
        const file = ev.target.files[0];
        if (label) label.innerHTML = file ? U.icon('file') + ' ' + e(file.name) + ' <span class="cs-opt">(' + Math.max(1, Math.round(file.size / 1024)) + ' Ko)</span>' : CS.t(ctl.lang, 'dropFile');
      }
      const form = ev.target.closest('form[data-apply]');
      if (form && ev.target.id) showError(form, ev.target.id, '');
    });
    root.addEventListener('submit', (ev) => {
      const form = ev.target.closest('form[data-apply]');
      if (!form) return;
      ev.preventDefault();
      submitApply(form, ctl);
    });
  };

  CS.site = site;
})();

</script>
<script>
/* Éditeur du site carrière (côté équipe RH) : pages à blocs, offres, formulaire, thème, statistiques,
   candidatures, paramètres, traductions et historique des versions. */
window.CS = window.CS || {};

(function () {
  const U = CS.U;
  const e = U.esc;
  const store = CS.store;
  const B = () => CS.blocks.BLOCKS;
  const D = () => CS.store.state.draft;

  const ui = {
    tab: 'page',
    pageId: 'home',
    blockId: null,
    jobId: null,
    jobFilter: 'all',
    appId: null, appJob: '', appStatus: '',
    device: 'desktop',
    route: { name: 'home' },
    lang: null /* langue en cours d'édition */,
    adding: false,
    pageSettings: false,
    history: false,
    viewVersion: null /* aperçu d'une ancienne version */,
    statsDays: 30,
    open: {},
    confirm: null,
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const defLang = () => CS.site.defaultLang(D());
  const trMode = () => ui.lang && ui.lang !== defLang();
  const langShort = (l) => (CS.LANGS.find((x) => x.id === l) || { short: String(l).toUpperCase() }).short;

  /* ---------- Toast ---------- */
  CS.toast = (msg, kind) => {
    const t = $('#ad-toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'ad-toast is-on' + (kind ? ' ad-toast--' + kind : '');
    clearTimeout(t._h);
    t._h = setTimeout(() => (t.className = 'ad-toast'), kind === 'warn' ? 6000 : 3200);
  };

  /* ---------- Pages ---------- */
  const curPage = () => D().pages.find((p) => p.id === ui.pageId) || D().pages[0];
  const blocks = () => curPage().blocks;
  const pageRoute = () => (curPage() === D().pages[0] ? { name: 'home' } : { name: 'page', id: curPage().id });

  /* ---------- Contrôleur de l'aperçu ---------- */
  const preview = {
    mode: 'editor',
    root: null,
    get route() { return ui.route; },
    get lang() { return ui.lang; },
    set lang(v) { ui.lang = v; },
    get selectedId() { return ui.tab === 'page' ? ui.blockId : null; },
    getData: () => (ui.viewVersion ? (store.state.versions.find((v) => v.id === ui.viewVersion) || {}).snapshot || D() : D()),
    go(route, after) {
      ui.route = route;
      if (route.name === 'page' || route.name === 'home') {
        const pg = route.name === 'home' ? D().pages[0] : D().pages.find((p) => p.id === route.id);
        if (pg && pg.id !== ui.pageId && ui.tab === 'page' && !ui.viewVersion) { ui.pageId = pg.id; ui.blockId = null; renderPanel(); }
      }
      renderPreview(true);
      const fr = $('#ad-frame');
      if (fr && !after) fr.scrollTo({ top: 0, behavior: 'instant' });
      if (after) requestAnimationFrame(after);
      renderStageBar();
    },
    setLang(l) { ui.lang = l; renderAll(); },
    onSelectBlock(id) {
      if (ui.viewVersion) return;
      ui.tab = 'page';
      ui.blockId = id;
      ui.adding = false;
      renderAll();
    },
    onApply(app) {
      store.mutate((s) => s.applications.unshift(app), { structural: true });
      CS.toast('Candidature de test enregistrée : retrouvez-la dans l’onglet Candidatures.');
    },
  };

  let rafId = 0;
  const renderPreview = (now) => {
    if (!preview.root) return;
    const run = () => { rafId = 0; CS.site.render(preview); };
    if (now) { cancelAnimationFrame(rafId); run(); return; }
    if (!rafId) rafId = requestAnimationFrame(run);
  };
  const scrollPreviewTo = (blockId) => {
    const el = preview.root && preview.root.querySelector('#sec-' + CSS.escape(blockId));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  const resetFrame = () => { const fr = $('#ad-frame'); if (fr) fr.scrollTo({ top: 0, behavior: 'instant' }); };

  /* ---------- Champs génériques ----------
     data-bind="scope|chemin" relie un contrôle à l'état. scope : block, job, theme, settings, form, page.
     data-bind="tr|clé|chemin" écrit une traduction dans i18n[langue][clé][chemin]. */
  const scopeObj = (scope) => {
    const d = D();
    if (scope === 'block') return blocks().find((b) => b.id === ui.blockId);
    if (scope === 'page') return curPage();
    if (scope === 'job') return d.jobs.find((j) => j.id === ui.jobId);
    if (scope === 'theme') return d.theme;
    if (scope === 'settings') return d.settings;
    if (scope === 'form') return d.form;
    return null;
  };
  const bindAttr = (scope, path, extra) => ' data-bind="' + scope + '|' + path + '"' + (extra || '');
  const val = (scope, path) => {
    const o = scopeObj(scope);
    const v = o ? U.getPath(o, path) : '';
    return v == null ? '' : v;
  };

  const fieldWrap = (id, label, control, help, cls) =>
    '<div class="ad-field ' + (cls || '') + '">' + (label ? '<label class="ad-label" for="' + id + '">' + e(label) + '</label>' : '') + control + (help ? '<p class="ad-help">' + help + '</p>' : '') + '</div>';
  let fid = 0;
  const nid = () => 'f' + ++fid;

  const ctrl = {
    text(scope, path, label, o) {
      o = o || {};
      const id = nid();
      return fieldWrap(id, label, '<input class="ad-input" id="' + id + '" type="' + (o.type || 'text') + '" value="' + e(val(scope, path)) + '"' + (o.placeholder ? ' placeholder="' + e(o.placeholder) + '"' : '') + (o.list ? ' list="' + o.list + '"' : '') + (o.min ? ' min="' + o.min + '"' : '') + bindAttr(scope, path, o.kind ? ' data-kind="' + o.kind + '"' : '') + (o.structural ? ' data-structural' : '') + '>', o.help);
    },
    textarea(scope, path, label, o) {
      o = o || {};
      const id = nid();
      const v = val(scope, path);
      return fieldWrap(id, label, '<textarea class="ad-input" id="' + id + '" rows="' + (o.rows || 3) + '"' + bindAttr(scope, path, o.kind ? ' data-kind="' + o.kind + '"' : '') + (o.counter ? ' data-counter="' + o.counter + '"' : '') + '>' + e(Array.isArray(v) ? v.join('\n') : v) + '</textarea>' +
        (o.counter ? '<p class="ad-counter" data-counter-for="' + id + '">' + String(v).length + ' / ' + o.counter + '</p>' : ''), o.help);
    },
    select(scope, path, label, options, o) {
      o = o || {};
      const id = nid();
      const v = String(val(scope, path));
      return fieldWrap(id, label, '<select class="ad-input" id="' + id + '"' + bindAttr(scope, path) + (o.structural ? ' data-structural' : '') + '>' +
        options.map((op) => { const ov = typeof op === 'object' ? op.value : op; const ol = typeof op === 'object' ? op.label : op; return '<option value="' + e(ov) + '"' + (String(ov) === v ? ' selected' : '') + '>' + e(ol) + '</option>'; }).join('') + '</select>', o.help);
    },
    toggle(scope, path, label, o) {
      o = o || {};
      const id = nid();
      return '<div class="ad-field ad-field--toggle"><label class="ad-switch" for="' + id + '"><input type="checkbox" id="' + id + '"' + (val(scope, path) ? ' checked' : '') + bindAttr(scope, path, ' data-kind="bool"') + (o.structural ? ' data-structural' : '') + '><span class="ad-switch__track" aria-hidden="true"></span><span>' + e(label) + '</span></label>' + (o.help ? '<p class="ad-help">' + o.help + '</p>' : '') + '</div>';
    },
    segmented(scope, path, label, options, o) {
      o = o || {};
      const v = String(val(scope, path));
      const name = nid();
      return '<div class="ad-field"><span class="ad-label" id="' + name + '-l">' + e(label) + '</span><div class="ad-seg" role="radiogroup" aria-labelledby="' + name + '-l">' +
        options.map((op) => '<label class="ad-seg__opt"><input type="radio" name="' + name + '" value="' + e(op.value) + '"' + (op.value === v ? ' checked' : '') + bindAttr(scope, path) + (o.structural ? ' data-structural' : '') + '><span>' + e(op.label) + '</span></label>').join('') +
        '</div>' + (o.help ? '<p class="ad-help">' + o.help + '</p>' : '') + '</div>';
    },
    color(scope, path, label, help) {
      const id = nid();
      const v = val(scope, path);
      return '<div class="ad-field ad-field--color"><label class="ad-label" for="' + id + '">' + e(label) + '</label><div class="ad-color"><input type="color" aria-label="' + e(label) + ' (sélecteur)" value="' + e(U.isHex(v) ? (v.length === 4 ? '#' + v.slice(1).split('').map((c) => c + c).join('') : v) : '#000000') + '"' + bindAttr(scope, path, ' data-kind="color"') + '><input class="ad-input ad-input--mono" id="' + id + '" value="' + e(v) + '" maxlength="7" spellcheck="false"' + bindAttr(scope, path, ' data-kind="color"') + '></div>' + (help ? '<p class="ad-help">' + help + '</p>' : '') + '</div>';
    },
    image(scope, path, label, o) {
      o = o || {};
      const v = val(scope, path);
      const th = D().theme;
      const has = v && !U.isPlaceholder(v);
      return '<div class="ad-field"><span class="ad-label">' + e(label) + '</span><div class="ad-image">' +
        (v || !o.optional ? '<img src="' + e(U.imgSrc(v, th, 4 / 3)) + '" alt="">' : '<span class="ad-image__none">' + U.icon('image') + '</span>') +
        '<div class="ad-image__actions"><label class="ad-btn ad-btn--sm">' + U.icon('upload') + 'Importer<input type="file" accept="image/*" hidden data-image="' + scope + '|' + path + '"></label>' +
        (!o.optional ? '<button type="button" class="ad-btn ad-btn--sm ad-btn--quiet" data-act="ph" data-target="' + scope + '|' + path + '">' + (has ? 'Visuel d’exemple' : 'Autre exemple') + '</button>' : '') +
        (o.optional && v ? '<button type="button" class="ad-btn ad-btn--sm ad-btn--quiet" data-act="img-clear" data-target="' + scope + '|' + path + '">Retirer</button>' : '') +
        '</div></div>' + (!has && !o.optional ? '<p class="ad-help">Visuel d’exemple aux couleurs du thème. Importez vos photos pour le remplacer.</p>' : '') + '</div>';
    },
    icon(scope, path, label) {
      const v = val(scope, path);
      const name = nid();
      return '<div class="ad-field"><span class="ad-label">' + e(label) + '</span><div class="ad-icons" role="radiogroup" aria-label="' + e(label) + '">' +
        U.ICON_CHOICES.map((ic) => '<label class="ad-icons__opt" title="' + ic + '"><input type="radio" name="' + name + '" value="' + ic + '"' + (ic === v ? ' checked' : '') + bindAttr(scope, path) + '><span>' + U.icon(ic) + '</span></label>').join('') + '</div></div>';
    },
    video(scope, path, label, help) {
      const id = nid();
      const v = String(val(scope, path));
      const isBlob = v.indexOf('blob:') === 0;
      return fieldWrap(id, label, '<input class="ad-input" id="' + id + '" type="url" placeholder="https://www.youtube.com/watch?v=…" value="' + e(isBlob ? '' : v) + '"' + bindAttr(scope, path) + '>' +
        '<div class="ad-row"><label class="ad-btn ad-btn--sm">' + U.icon('upload') + 'Importer un fichier vidéo<input type="file" accept="video/mp4,video/webm" hidden data-video="' + scope + '|' + path + '"></label>' + (isBlob ? '<span class="ad-chip ad-chip--ok">Fichier importé</span>' : '') + '</div>',
        e(help || '') + (isBlob ? '<br>Dans ce prototype, le fichier vidéo n’est conservé que jusqu’au rechargement de la page.' : ''));
    },
    /* Champ de traduction : texte source affiché au-dessus, saisie dans la langue cible */
    tr(key, path, label, source, type) {
      const id = nid();
      const map = ((D().i18n || {})[ui.lang] || {})[key] || {};
      let v = map[path];
      const lines = Array.isArray(source);
      if (Array.isArray(v)) v = v.join('\n');
      const src = lines ? source.join(' · ') : U.mdText(source);
      const long = type === 'textarea' || type === 'md' || lines;
      const attrs = ' id="' + id + '" data-bind="tr|' + e(key) + '|' + e(path) + '"' + (lines ? ' data-kind="lines"' : '');
      return '<div class="ad-field ad-trfield' + (v ? '' : ' is-missing') + '"><label class="ad-label" for="' + id + '">' + e(label) + (v ? '' : ' <span class="ad-chip ad-chip--sm ad-chip--warn">à traduire</span>') + '</label>' +
        '<p class="ad-src" lang="' + defLang() + '"><span>' + langShort(defLang()) + '</span>' + e(src.length > 180 ? src.slice(0, 180) + '…' : src) + '</p>' +
        (long ? '<textarea class="ad-input" rows="' + (type === 'md' ? 8 : 3) + '"' + attrs + ' lang="' + ui.lang + '">' + e(v || '') + '</textarea>' : '<input class="ad-input"' + attrs + ' lang="' + ui.lang + '" value="' + e(v || '') + '">') +
        (lines ? '<p class="ad-help">Un choix par ligne, dans le même ordre que l’original.</p>' : '') + '</div>';
    },
  };

  /* Options d'action des boutons : actions de base + les pages du site */
  const actionOptions = () => CS.blocks.ACTIONS.slice(0, 2).concat(D().pages.slice(1).map((p) => ({ value: 'page:' + p.id, label: 'Aller à la page « ' + p.title + ' »' })), CS.blocks.ACTIONS.slice(2));

  const listField = (scope, f, items) => {
    const base = 'props.' + f.key;
    let h = '<div class="ad-field"><div class="ad-listhead"><span class="ad-label">' + e(f.label) + ' <span class="ad-muted">(' + items.length + ')</span></span></div><div class="ad-items">';
    items.forEach((it, i) => {
      const path = base + '.' + i;
      const okey = ui.blockId + ':' + (it._id || path);
      const title = it[f.itemLabel] || it.title || it.caption || 'Élément ' + (i + 1);
      h += '<details class="ad-item"' + (ui.open[okey] ? ' open' : '') + ' data-open-key="' + e(okey) + '"><summary><span class="ad-item__title">' + e(U.mdText(title)) + '</span>' +
        '<span class="ad-item__tools"><button type="button" class="ad-iconbtn" data-act="item-up" data-list="' + base + '" data-i="' + i + '" aria-label="Monter"' + (i === 0 ? ' disabled' : '') + '>' + U.icon('up') + '</button>' +
        '<button type="button" class="ad-iconbtn" data-act="item-down" data-list="' + base + '" data-i="' + i + '" aria-label="Descendre"' + (i === items.length - 1 ? ' disabled' : '') + '>' + U.icon('down') + '</button>' +
        '<button type="button" class="ad-iconbtn ad-iconbtn--danger" data-act="item-del" data-list="' + base + '" data-i="' + i + '" aria-label="Supprimer">' + U.icon('trash') + '</button></span></summary><div class="ad-item__body">';
      f.fields.forEach((sf) => (h += fieldFor(scope, sf, path + '.' + sf.key)));
      h += '</div></details>';
    });

  /* ---------- Statistiques ---------- */
  const fmtN = (n) => Math.round(n).toLocaleString('fr-FR');
  const fmtPct = (n) => (isFinite(n) ? (Math.round(n * 1000) / 10).toLocaleString('fr-FR') : '0') + ' %';
  const sumDays = (days) => {
    const daily = store.state.stats.daily;
    const t = { visits: 0, jobViews: 0, applyStarts: 0, applies: 0, consentYes: 0, consentNo: 0, sources: {}, appSources: {}, jobs: {}, langs: {}, sample: false };
    days.forEach((k) => {
      const d = daily[k];
      if (!d) return;
      if (d.s) t.sample = true;
      t.visits += d.visits || 0; t.applyStarts += d.applyStarts || 0; t.applies += d.applies || 0; t.consentYes += d.consentYes || 0; t.consentNo += d.consentNo || 0;
      Object.keys(d.jobViews || {}).forEach((j) => { t.jobViews += d.jobViews[j]; t.jobs[j] = (t.jobs[j] || 0) + d.jobViews[j]; });
      ['sources', 'appSources', 'langs'].forEach((f) => Object.keys(d[f] || {}).forEach((x) => (t[f][x] = (t[f][x] || 0) + d[f][x])));
    });
    return t;
  };
  const dayList = (n, offset) => Array.from({ length: n }, (_, i) => U.dayKey(Date.now() - (n - 1 - i + (offset || 0)) * 86400000));
  const niceMax = (m) => { if (m <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(m))); const r = m / p; return (r <= 2 ? 2 : r <= 5 ? 5 : 10) * p; };

  /* Histogramme d'une seule série, en HTML : barres fines arrondies en haut, axe Y à 3 graduations, infobulle au survol */
  const columnChart = (title, sub, keys, values, unit) => {
    const max = niceMax(Math.max(1, ...values));
    const ticks = [0, max / 2, max];
    const lab = (k) => new Date(k + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    const every = keys.length > 14 ? 7 : 1;
    const total = values.reduce((a, b) => a + b, 0);
    return '<figure class="ad-chart ad-card"><figcaption><h3 class="ad-chart__title">' + e(title) + '</h3><p class="ad-chart__sub">' + e(sub) + ' · total ' + fmtN(total) + '</p></figcaption>' +
      '<div class="ad-chart__plot"><div class="ad-chart__y" aria-hidden="true">' + ticks.slice().reverse().map((t) => '<span>' + fmtN(t) + '</span>').join('') + '</div>' +
      '<div class="ad-chart__area"><div class="ad-chart__grid" aria-hidden="true"><i></i><i></i><i></i></div><div class="ad-chart__bars" role="list" aria-label="' + e(title) + '">' +
      values.map((v, i) => '<div class="ad-chart__col" role="listitem" tabindex="0" data-tip="' + e(lab(keys[i]) + ' : ' + fmtN(v) + ' ' + unit) + '" aria-label="' + e(lab(keys[i]) + ' : ' + fmtN(v) + ' ' + unit) + '"><span style="height:' + ((v / max) * 100).toFixed(2) + '%"></span></div>').join('') +
      '</div><div class="ad-chart__x" aria-hidden="true">' + keys.map((k, i) => '<span>' + ((keys.length - 1 - i) % every === 0 ? e(lab(k)) : '') + '</span>').join('') + '</div></div></div>' +
      '<details class="ad-chart__table"><summary>Voir les données</summary><div class="ad-tablewrap"><table class="ad-table ad-table--compact"><thead><tr><th scope="col">Jour</th><th scope="col" class="ad-num">' + e(title) + '</th></tr></thead><tbody>' +
      keys.map((k, i) => '<tr><td>' + e(lab(k)) + '</td><td class="ad-num">' + fmtN(values[i]) + '</td></tr>').join('') + '</tbody></table></div></details></figure>';
  };
  /* Barres horizontales d'une seule série (entonnoir, sources) */

      hbars(funnel, (r) => { const i = funnel.indexOf(r); if (i === 1) return fmtN(r.value) + ' <span class="ad-muted">' + (cur.visits ? (r.value / cur.visits).toFixed(1).replace('.', ',') : '0') + ' par visite</span>'; return fmtN(r.value) + (i ? ' <span class="ad-muted">' + fmtPct(funnel[i - 1].value ? r.value / funnel[i - 1].value : 0) + '</span>' : ''); }) + '</section>' +
